name: Go CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: write

jobs:
  test:
    name: 测试、静态检查与构建
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      REDIS_TEST_ADDR: 127.0.0.1:6379
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: 单元测试
        run: go test ./...

      - name: 静态检查
        run: go vet ./...

      - name: 构建 Gateway
        run: go build -o /tmp/llm-gateway ./cmd/gateway

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 安装前端依赖
        working-directory: web
        run: npm ci

      - name: 构建管理台源码
        working-directory: web
        run: npx esbuild js/entry.js --bundle --format=iife --target=es2020 --outfile=/tmp/llm-gateway-admin.js

      # 一次性修复已确认过期的 dist；仅对本次诊断提交运行，修复后立即删除该临时步骤。
      - name: 一次性同步管理台构建产物
        if: ${{ github.ref == 'refs/heads/dev' && github.event_name == 'push' && !contains(github.event.head_commit.message, '同步管理台部署 bundle') }}
        run: |
          if ! cmp -s /tmp/llm-gateway-admin.js web/static/dist/app.js; then
            cp /tmp/llm-gateway-admin.js web/static/dist/app.js
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add web/static/dist/app.js
            git commit -m "build: 同步管理台部署 bundle"
            git push origin HEAD:dev
          fi

      - name: 校验前端语法与关键功能字段
        run: |
          node --check web/static/dist/app.js
          node --check /tmp/llm-gateway-admin.js
          # 直接比较 CI 从当前源码生成的 bundle 与已提交部署产物，防止漏提交或提交过期的 dist。
          if ! cmp -s /tmp/llm-gateway-admin.js web/static/dist/app.js; then
            echo "::error::web/static/dist/app.js 与当前管理台源码构建结果不一致，请重新生成并提交部署 bundle"
            diff -u web/static/dist/app.js /tmp/llm-gateway-admin.js | head -120 || true
            exit 1
          fi
          # 调用记录耗时字段必须存在于部署 bundle。
          grep -q 'upstream_http_status' web/static/dist/app.js
          grep -q 'time_to_upstream_headers_ms' web/static/dist/app.js
          grep -q 'time_to_first_byte_ms' web/static/dist/app.js
          # 远程 Provider 选择逻辑分别检查源文件和实际部署 bundle。
          grep -q 'available_backends' web/js/app/main.js
          grep -q 'configured_remote' web/js/app/main.js
          grep -q 'available_backends' web/static/dist/app.js
          grep -q 'configured_remote' web/static/dist/app.js

