name: Go CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  test:
    name: 测试、静态检查与构建
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: 单元测试
        run: go test ./...

      - name: 静态检查
        run: go vet ./...

      - name: 构建 Gateway
        run: go build -o /tmp/llm-gateway ./cmd/gateway

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 构建管理台
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: 检查已提交的 dist 与源码一致
        run: git diff --exit-code -- web/static/dist/app.js
