name: Go CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  test:
    name: 测试、静态检查与构建
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      REDIS_TEST_ADDR: 127.0.0.1:6379
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: 单元测试
        run: go test ./...

      - name: 静态检查
        run: go vet ./...

      - name: 构建 Gateway
        run: go build -o /tmp/llm-gateway ./cmd/gateway

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 安装前端依赖
        working-directory: web
        run: npm ci

      - name: 构建管理台源码
        working-directory: web
        run: npx esbuild js/entry.js --bundle --format=iife --target=es2020 --outfile=/tmp/llm-gateway-admin.js

      - name: 校验前端语法与关键功能字段
        run: |
          node --check web/static/dist/app.js
          node --check /tmp/llm-gateway-admin.js
          # 请求耗时字段由调用记录模块提供，只要求部署 bundle 完整。
          grep -q 'upstream_http_status' web/static/dist/app.js
          grep -q 'time_to_upstream_headers_ms' web/static/dist/app.js
          grep -q 'time_to_first_byte_ms' web/static/dist/app.js
          # 远程 Provider 选择能力同时要求存在于源码构建产物与部署 bundle。
          for asset in web/static/dist/app.js /tmp/llm-gateway-admin.js; do
            grep -q 'available_backends' "$asset"
            grep -q 'configured_remote' "$asset"
          done
