name: Go CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# 新提交到同一分支时取消过期 CI，避免旧 HEAD 占用 Runner。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contracts:
    name: 配置、API 契约与前端
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 校验路由与 OpenAPI paths
        run: python3 scripts/check_openapi_routes.py

      - name: 校验高风险 Schema 与 Handler 状态契约
        run: python3 scripts/check_openapi_contracts.py

      - name: 配置 Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: 校验配置结构、环境变量与部署模板
        run: go run ./scripts/check_config_contract.go

      - name: 验证根目录 Docker Compose 配置
        run: |
          cp .env.example .env
          docker compose config -q

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 安装前端依赖
        working-directory: web
        run: npm ci

      - name: 构建管理台与部署 Bundle
        working-directory: web
        run: npm run build

      - name: 校验前端语法、关键字段与 Bundle 一致性
        run: |
          node --check web/js/providers-entry.js
          node --check web/static/dist/providers-admin.js
          node --check web/static/dist/app.js
          node --check web/static/dist/key-service-picker.js
          grep -q 'api_key_ciphertext' internal/server/admin_providers_http.go
          grep -q 'clear-key' web/js/providers-entry.js
          grep -q 'model_mappings' web/static/dist/providers-admin.js
          grep -q 'upstream_http_status' web/static/dist/app.js
          grep -q 'time_to_upstream_headers_ms' web/static/dist/app.js
          grep -q 'time_to_first_byte_ms' web/static/dist/app.js
          grep -q 'available_backends' web/js/app/main.js
          grep -q 'configured_remote' web/js/app/main.js
          grep -q 'available_backends' web/static/dist/app.js
          grep -q 'configured_remote' web/static/dist/app.js
          if ! git diff --quiet -- web/static/dist/app.js web/static/dist/providers-admin.js web/static/dist/key-service-picker.js; then
            echo "::error::提交的前端部署 Bundle 与当前源码构建结果不一致，请重新生成并提交"
            git diff -- web/static/dist/app.js web/static/dist/providers-admin.js | head -120 || true
            exit 1
          fi

  go-quality:
    name: Go 测试、竞态与静态检查
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      REDIS_TEST_ADDR: 127.0.0.1:6379
      MYSQL_TEST_DSN: "root:gateway-test-password@tcp(127.0.0.1:3306)/llm_gateway_test?parseTime=true&charset=utf8mb4&loc=UTC"
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: gateway-test-password
          MARIADB_DATABASE: llm_gateway_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: 单元与集成测试
        run: go test ./...

      - name: 并发与数据竞态测试
        run: go test -race ./internal/provider ./internal/server ./internal/core ./internal/audit ./internal/live

      - name: 静态检查
        run: go vet ./...

  gateway-steady-load:
    name: Gateway 稳态负载与审计持久化
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      REDIS_TEST_ADDR: 127.0.0.1:6379
      MYSQL_TEST_DSN: "root:gateway-test-password@tcp(127.0.0.1:3306)/llm_gateway_test?parseTime=true&charset=utf8mb4&loc=UTC"
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: gateway-test-password
          MARIADB_DATABASE: llm_gateway_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: MariaDB 审计积压集成测试
        run: go test -count=1 -run TestWriterDrainsMariaDBBacklogAndPreservesAcceptedWrites -v ./internal/audit

      - name: Gateway 并发请求与真实审计负载
        run: |
          set -o pipefail
          GATEWAY_LOAD_TEST=1 /usr/bin/time -v go test -count=1 -run TestGatewayConcurrentRequestLoadWithMariaDBAudit -v ./internal/server 2>&1 | tee /tmp/gateway-request-load.txt

      - name: 保存 Gateway 请求负载产物
        uses: actions/upload-artifact@v4
        with:
          name: gateway-request-load-${{ github.sha }}
          path: /tmp/gateway-request-load.txt
          if-no-files-found: error
          retention-days: 30


  gateway-faults:
    name: Gateway 故障注入与恢复验证
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      REDIS_TEST_ADDR: 127.0.0.1:6379
      MYSQL_TEST_DSN: "root:gateway-test-password@tcp(127.0.0.1:3306)/llm_gateway_test?parseTime=true&charset=utf8mb4&loc=UTC"
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: gateway-test-password
          MARIADB_DATABASE: llm_gateway_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Gateway 上游延迟与 429/503 故障注入
        run: |
          set -o pipefail
          GATEWAY_LOAD_TEST=1 GATEWAY_FAULT_TEST=1 /usr/bin/time -v go test -count=1 -run TestGatewayConcurrentRequestLoadWithMariaDBAudit -v ./internal/server 2>&1 | tee /tmp/gateway-fault-injection.txt

      - name: 保存 Gateway 故障注入产物
        uses: actions/upload-artifact@v4
        with:
          name: gateway-fault-injection-${{ github.sha }}
          path: /tmp/gateway-fault-injection.txt
          if-no-files-found: error
          retention-days: 30

      - name: Gateway TCP 连接拒绝与恢复验证
        run: |
          set -o pipefail
          GATEWAY_LOAD_TEST=1 GATEWAY_TRANSPORT_FAILURE_TEST=1 /usr/bin/time -v go test -count=1 -run TestGatewayConcurrentRequestLoadWithMariaDBAudit -v ./internal/server 2>&1 | tee /tmp/gateway-transport-recovery.txt

      - name: 保存 Gateway 传输恢复产物
        uses: actions/upload-artifact@v4
        with:
          name: gateway-transport-recovery-${{ github.sha }}
          path: /tmp/gateway-transport-recovery.txt
          if-no-files-found: error
          retention-days: 30

      - name: Gateway DNS 解析失败与审计状态验证
        run: |
          set -o pipefail
          GATEWAY_DNS_FAILURE_TEST=1 /usr/bin/time -v go test -count=1 -run TestGatewayConcurrentRequestLoadWithMariaDBAudit -v ./internal/server 2>&1 | tee /tmp/gateway-dns-failure.txt

      - name: 保存 Gateway DNS 故障产物
        uses: actions/upload-artifact@v4
        with:
          name: gateway-dns-failure-${{ github.sha }}
          path: /tmp/gateway-dns-failure.txt
          if-no-files-found: error
          retention-days: 30

      - name: Gateway 已提交响应头后的流式正文中断验证
        run: |
          set -o pipefail
          GATEWAY_STREAM_FAILURE_TEST=1 /usr/bin/time -v go test -count=1 -run TestGatewayConcurrentRequestLoadWithMariaDBAudit -v ./internal/server 2>&1 | tee /tmp/gateway-stream-failure.txt

      - name: 保存 Gateway 流式中断产物
        uses: actions/upload-artifact@v4
        with:
          name: gateway-stream-failure-${{ github.sha }}
          path: /tmp/gateway-stream-failure.txt
          if-no-files-found: error
          retention-days: 30

      - name: Provider TLS 握手中断故障验证
        run: |
          set -o pipefail
          go test -count=1 -run TestOpenAICompatibleProviderMapsTLSHandshakeInterruptionWithoutUpstreamStatus -v ./internal/provider 2>&1 | tee /tmp/provider-tls-handshake-failure.txt

      - name: 保存 Provider TLS 握手故障产物
        uses: actions/upload-artifact@v4
        with:
          name: provider-tls-handshake-failure-${{ github.sha }}
          path: /tmp/provider-tls-handshake-failure.txt
          if-no-files-found: error
          retention-days: 30

  build:
    name: 编译与 Docker 镜像
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: 构建 Gateway
        run: go build -o /tmp/llm-gateway ./cmd/gateway

      - name: 配置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 构建 Docker 部署镜像（启用 GitHub Actions 层缓存）
        uses: docker/build-push-action@v6
        with:
          context: .
          target: release
          tags: llm-gateway:ci
          push: false
          cache-from: type=gha,scope=llm-gateway-release
          cache-to: type=gha,scope=llm-gateway-release,mode=max
