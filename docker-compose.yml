services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: llm-gateway
    restart: unless-stopped

    # 只允许本机访问，由 1Panel/OpenResty 对公网反代。
    ports:
      - "127.0.0.1:8088:8088"

    # 允许 Gateway 通过 host.docker.internal 访问宿主机服务（备用连接方式）。
    extra_hosts:
      - "host.docker.internal:host-gateway"

    # Gateway 需要下载 GGUF，模型文件直接写入宿主机目录。
    volumes:
      - "${MODEL_HOST_DIR}:/data/models"
      - "./config.yaml:/etc/llm-gateway/config.yaml:ro"

    # 配置文件只承载本地后端和基础服务参数；远程 Provider 从 Web 管理台读取。
    environment:
      CONFIG_FILE: /etc/llm-gateway/config.yaml
      LLM_GATEWAY_DB_HOST: ${LLM_GATEWAY_DB_HOST:-Mariadb}
      LLM_GATEWAY_REDIS_ADDR: ${LLM_GATEWAY_REDIS_ADDR:-Redis:6379}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      LLM_GATEWAY_DB_PASSWORD: ${LLM_GATEWAY_DB_PASSWORD}
      LLM_GATEWAY_ADMIN_API_KEY: ${LLM_GATEWAY_ADMIN_API_KEY}
      # 新哈希采用 pbkdf2: 冒号分隔格式，不含 Compose 变量插值字符 $。
      LLM_GATEWAY_ADMIN_PASSWORD_HASH: "${LLM_GATEWAY_ADMIN_PASSWORD_HASH:?请在 .env 中配置 Web 控制台初始密码哈希}"
      # 仅用于数据库尚无账号设置时的初始开关；已有数据库设置优先。
      LLM_GATEWAY_WEB_PASSWORD_ENABLED: "${LLM_GATEWAY_WEB_PASSWORD_ENABLED:-true}"
      # 忘记密码时临时设为 true，强制使用 .env 哈希；成功改密后必须改回 false。
      LLM_GATEWAY_WEB_LOGIN_RESET_FROM_ENV: "${LLM_GATEWAY_WEB_LOGIN_RESET_FROM_ENV:-false}"
      LLAMA_CPP_BASE_URL: ${LLAMA_CPP_BASE_URL}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL}
      LLAMA_UPSTREAM_API_KEY: ${LLAMA_UPSTREAM_API_KEY}
      LLAMA_REQUEST_TIMEOUT_SECONDS: ${LLAMA_REQUEST_TIMEOUT_SECONDS:-0}
      LLM_GATEWAY_PROVIDER_ENCRYPTION_KEY: ${LLM_GATEWAY_PROVIDER_ENCRYPTION_KEY:-}
      LLM_BACKEND: ${LLM_BACKEND}
      REDIS_ROOT_PASSWORD: ${REDIS_ROOT_PASSWORD}

    # 模型下载目录通常由宿主机 root 创建；首次部署先使用 root 简化权限问题。
    user: "0:0"

    networks:
      - existing-ai

networks:
  existing-ai:
    external: true
    name: ${EXISTING_DOCKER_NETWORK}
