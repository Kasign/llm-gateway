server:
  host: 0.0.0.0
  port: 8088
  # 只有配置的实际反向代理来源才可信；留空时忽略转发 IP 头。
  # 不要无条件配置 0.0.0.0/0。
  trusted_proxies: []

auth:
  admin_api_key: "${LLM_GATEWAY_ADMIN_API_KEY}"
  # Web 控制台仅使用密码登录；设置页可启用/关闭密码保护和修改密码。
  # 初始哈希通过主 .env 的 LLM_GATEWAY_ADMIN_PASSWORD_HASH 注入。
  admin_password_hash: "${LLM_GATEWAY_ADMIN_PASSWORD_HASH}"
  # 仅在数据库尚无 web_admin_login 记录时生效；容器部署可由 LLM_GATEWAY_WEB_PASSWORD_ENABLED 覆盖。
  web_password_enabled: true
  # 忘记密码恢复开关只通过环境变量 LLM_GATEWAY_WEB_LOGIN_RESET_FROM_ENV 临时启用。
  # 或首次部署时用环境变量明文，启动后会哈希并丢弃明文（勿写入镜像）
  # admin_password: "${LLM_GATEWAY_ADMIN_PASSWORD}"
  session_ttl_hours: 168

database:
  host: "${LLM_GATEWAY_DB_HOST}"
  port: 3306
  name: "llm_gateway"
  user: "llm_gateway"
  password: "${LLM_GATEWAY_DB_PASSWORD}"
  auto_init: true
  admin_user: "root"
  admin_password: "${MARIADB_ROOT_PASSWORD}"
  migration_file: /app/migrations/001_init.sql

redis:
  addr: "${LLM_GATEWAY_REDIS_ADDR}"
  password: "${REDIS_ROOT_PASSWORD}"
  db: 0

llama:
  # 空库第一次启动时 /v1 走哪个上游。管理台切换后以数据库为准。
  backend: "${LLM_BACKEND}"
  llamacpp_base_url: "${LLAMA_CPP_BASE_URL}"
  ollama_base_url: "${OLLAMA_BASE_URL}"
  upstream_api_key: "${LLAMA_UPSTREAM_API_KEY}"
  # 本地模型生成可能较慢。0 不设客户端整体请求时限；正整数设置最大秒数（1–604800）。
  request_timeout_seconds: ${LLAMA_REQUEST_TIMEOUT_SECONDS}
  models_max: 1
  auto_load_on_proxy: true
  # 不写 warm_start 时关闭。Codex 长连接需要开启。
  warm_start: true
  warm_start_comment: keepalive
  warm_start_interval_seconds: 15
  max_output_tokens: 8192

storage:
  models_dir: /data/models

download:
  hf_base_url: "https://hf-mirror.com"
  ollama_library_url: "https://ollama.com"
  timeout_seconds: 3600
  catalog_timeout_seconds: 60
  user_agent: "llm-gateway/3.0"

logging:
  enabled: true
  verbose: false
  # 完整请求/响应正文留存，可能包含提示词、代码和模型回答。
  store_payload: true
  # 流事件默认只保存类型、字段、字节数与时间；以下两项会保留原始内容，应谨慎开启。
  store_stream_raw: false
  store_stream_preview: false
  # 默认不自动删除历史请求。设为正数后，只清理超期且已结束的请求。
  retention_days: 0
  # 每个小事务最多处理的请求数；清理进程每轮最多执行 10 个批次。
  retention_batch_size: 500
  # 自动清理间隔，单位秒（60–86400）。
  retention_interval_seconds: 3600


# 远程 Provider 统一由 Web 管理台创建并持久化；这里不预置厂商密钥或连接配置。

# 多 Agent 独立入口（可选）。每个入口固定一个 Provider 和默认模型。
# 配置好 deepseek/openai 等 OpenAI-compatible Provider 后即可同时暴露：
# /ollama/v1/*、/llama/v1/*、/deepseek/v1/*、/gpt/v1/*。
# 现有 /v1/* 入口不受影响，仍使用管理台当前活动 Provider。
agents: []
