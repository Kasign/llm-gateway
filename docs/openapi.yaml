openapi: 3.1.0
info:
  title: LLM Gateway API
  version: 0.1.0
  summary: LLM Gateway 稳定入口的分阶段 API 契约
  description: |
    本规范是首阶段、部分覆盖的机器可读契约，不代表所有历史管理 API 均已描述。
    已纳入：健康检查、公共推理入口、配置 Agent 前缀入口、调用统计及 Web Provider 管理。
    管理操作需要有效管理员网页登录态或部署配置的管理员凭据；推理请求使用调用方 Gateway API Key。
  x-contract-status: partial
servers:
  - url: /
    description: 当前部署的 Gateway 主机
tags:
  - name: Inference
    description: 对 OpenAI-compatible 与 Anthropic Messages 入口的转发
  - name: Admin
    description: 管理员会话保护的只读统计和 Provider 管理
  - name: APIKeys
    description: 生成与治理调用方 Gateway API Key；明文只在创建或轮换时返回一次。
  - name: Authentication
    description: 控制台登录、会话注销和凭据更新。
paths:
  /health:
    get:
      tags: [Inference]
      summary: 查看 Gateway 与依赖的健康状态
      description: 远程 Provider 状态主要表示已配置；健康检查结果不等于真实供应商推理 E2E 已通过。
      responses:
        "200":
          description: 健康状态
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /v1/models:
    get:
      tags: [Inference]
      summary: 列出当前活动 Provider 对外发布的模型
      security:
        - GatewayBearer: []
        - GatewayAPIKey: []
      responses:
        "200":
          description: 模型目录
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelList"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/chat/completions:
    post:
      tags: [Inference]
      summary: Chat Completions 推理
      security:
        - GatewayBearer: []
        - GatewayAPIKey: []
      requestBody:
        $ref: "#/components/requestBodies/InferenceJSON"
      responses:
        "200":
          $ref: "#/components/responses/InferenceResponse"
        "400":
          $ref: "#/components/responses/InferenceError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          $ref: "#/components/responses/InferenceError"
        "503":
          $ref: "#/components/responses/InferenceError"
        "504":
          $ref: "#/components/responses/InferenceError"
  /v1/completions:
    post:
      tags: [Inference]
      summary: Completions 推理
      security:
        - GatewayBearer: []
        - GatewayAPIKey: []
      requestBody:
        $ref: "#/components/requestBodies/InferenceJSON"
      responses:
        "200":
          $ref: "#/components/responses/InferenceResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          $ref: "#/components/responses/InferenceError"
        "503":
          $ref: "#/components/responses/InferenceError"
        "504":
          $ref: "#/components/responses/InferenceError"
  /v1/responses:
    post:
      tags: [Inference]
      summary: Responses API 推理
      description: 流式错误必须使用 Responses 事件形状；响应已提交后不能再更改 HTTP 状态。
      security:
        - GatewayBearer: []
        - GatewayAPIKey: []
      requestBody:
        $ref: "#/components/requestBodies/InferenceJSON"
      responses:
        "200":
          $ref: "#/components/responses/InferenceResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          $ref: "#/components/responses/InferenceError"
        "503":
          $ref: "#/components/responses/InferenceError"
        "504":
          $ref: "#/components/responses/InferenceError"
  /v1/messages:
    post:
      tags: [Inference]
      summary: Anthropic Messages 兼容转发
      description: 请求体限制为 32,000,000 字节；错误信封与 OpenAI 协议不同，具体兼容性取决于配置的上游。
      security:
        - GatewayBearer: []
        - GatewayAPIKey: []
      requestBody:
        $ref: "#/components/requestBodies/InferenceJSON"
      responses:
        "200":
          $ref: "#/components/responses/InferenceResponse"
        "400":
          $ref: "#/components/responses/InferenceError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          $ref: "#/components/responses/InferenceError"
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          $ref: "#/components/responses/InferenceError"
        "503":
          $ref: "#/components/responses/InferenceError"
        "504":
          $ref: "#/components/responses/InferenceError"
  /v1/messages/count_tokens:
    post:
      tags: [Inference]
      summary: 转发 Anthropic Messages Token 计数请求
      description: Gateway 不自行计算 Anthropic Token；该路径是否可用取决于上游实现。
      security:
        - GatewayBearer: []
        - GatewayAPIKey: []
      requestBody:
        $ref: "#/components/requestBodies/InferenceJSON"
      responses:
        "200":
          $ref: "#/components/responses/InferenceResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "502":
          $ref: "#/components/responses/InferenceError"
        "503":
          $ref: "#/components/responses/InferenceError"
        "504":
          $ref: "#/components/responses/InferenceError"
  /{agentPrefix}/v1/models:
    parameters:
      - $ref: "#/components/parameters/AgentPrefix"
    get:
      tags: [Inference]
      summary: 列出指定 Agent 固定 Provider 的模型
      description: agentPrefix 必须与启动配置中已启用的 Agent path_prefix 匹配；该路径不允许任意客户端选择 Provider。
      security:
        - GatewayBearer: []
        - GatewayAPIKey: []
      responses:
        "200":
          description: 模型目录
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelList"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /{agentPrefix}/v1/chat/completions:
    parameters:
      - $ref: "#/components/parameters/AgentPrefix"
    post:
      tags: [Inference]
      summary: 通过指定 Agent 执行 Chat Completions
      security:
        - GatewayBearer: []
        - GatewayAPIKey: []
      requestBody:
        $ref: "#/components/requestBodies/InferenceJSON"
      responses:
        "200":
          $ref: "#/components/responses/InferenceResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          $ref: "#/components/responses/InferenceError"
        "503":
          $ref: "#/components/responses/InferenceError"
        "504":
          $ref: "#/components/responses/InferenceError"
  /api/requests/stats:
    get:
      tags: [Admin]
      security:
        - AdminSessionBearer: []
        - AdminKey: []
      summary: 查询请求、延迟和 Token 来源聚合统计
      description: |
        仅管理员可访问。range 仅接受 24h、7d、30d；窗口按 started_at 使用 [from,to) 计算。
        Provider ID 是规范化后完整匹配，统计不继承请求列表的模型、状态或 Key 名称筛选。
        Tokens 区分上游 usage、llama.cpp timings 与来源未知；该来源分类不等同于费用核算。
      x-authentication-requirements:
        - valid admin web session
        - configured administrator credential
      parameters:
        - name: range
          in: query
          required: false
          description: 固定统计窗口，默认 24h
          schema:
            type: string
            enum: [24h, 7d, 30d]
            default: 24h
        - name: provider
          in: query
          required: false
          description: Provider ID 完整匹配；忽略大小写与首尾空格
          schema:
            type: string
            maxLength: 64
      responses:
        "200":
          description: 聚合统计结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestStats"
        "400":
          $ref: "#/components/responses/AdminError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/AdminError"
  /api/admin/providers:
    get:
      tags: [Admin]
      security:
        - AdminSessionBearer: []
        - AdminKey: []
      summary: 列出部署托管与 Web 管理的 Provider
      description: 返回 Key 是否已配置和掩码，不返回明文或密文；部署配置 Provider 为只读。
      x-authentication-requirements:
        - valid admin web session
        - configured administrator credential
      responses:
        "200":
          description: Provider 目录与密钥加密能力
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderList"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Admin]
      security:
        - AdminSessionBearer: []
        - AdminKey: []
      summary: 创建 Web 管理的 Provider
      description: API Key 仅接受写入；响应不会回显密钥。ID 与部署配置冲突时拒绝覆盖。
      x-authentication-requirements:
        - valid admin web session
        - configured administrator credential
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProviderMutation"
      responses:
        "201":
          description: Provider 创建成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderList"
        "400":
          $ref: "#/components/responses/AdminError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/AdminError"
        "503":
          $ref: "#/components/responses/AdminError"
  /api/admin/providers/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Web 管理的 Provider ID；部署托管项不可修改或删除
        schema:
          type: string
          minLength: 1
          maxLength: 64
    put:
      tags: [Admin]
      security:
        - AdminSessionBearer: []
        - AdminKey: []
      summary: 更新 Web 管理的 Provider
      description: 编辑时 api_key 留空表示保留既有 Key；清除 Key 必须使用单独的 clear-key 操作。
      x-authentication-requirements:
        - valid admin web session
        - configured administrator credential
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProviderMutation"
      responses:
        "200":
          description: 操作完成并返回当前 Provider 列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderList"
        "400":
          $ref: "#/components/responses/AdminError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/AdminError"
        "503":
          $ref: "#/components/responses/AdminError"
    delete:
      tags: [Admin]
      security:
        - AdminSessionBearer: []
        - AdminKey: []
      summary: 删除 Web 管理的 Provider
      description: 当前活动 Provider 不可删除；必须先切换活动上游。
      x-authentication-requirements:
        - valid admin web session
        - configured administrator credential
      responses:
        "204":
          description: Provider 已删除；响应正文为空。
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/AdminError"
        "409":
          $ref: "#/components/responses/AdminError"
        "503":
          $ref: "#/components/responses/AdminError"
  /api/admin/providers/{id}/enable:
    $ref: "#/components/pathItems/ProviderEnable"
  /api/admin/providers/{id}/disable:
    $ref: "#/components/pathItems/ProviderDisable"
  /api/admin/providers/{id}/clear-key:
    $ref: "#/components/pathItems/ProviderClearKey"
  /api/admin/providers/{id}/test:
    $ref: "#/components/pathItems/ProviderTest"

  /api/admin/keys:
    get:
      tags: [APIKeys]
      summary: 列出调用方 API Key 元数据
      description: 不返回明文 Key 或存储哈希。
      security:
        - AdminSessionBearer: []
        - AdminKey: []
      responses:
        "200":
          description: Key 元数据列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIKeyList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/AdminError"
    post:
      tags: [APIKeys]
      summary: 创建调用方 API Key
      description: 明文 Key 只在创建响应中返回一次；服务端持久化哈希，不提供再次查询明文的接口。
      security:
        - AdminSessionBearer: []
        - AdminKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/APIKeyMutation"
      responses:
        "200":
          description: 创建成功，包含只显示一次的明文 Key 与元数据
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIKeyCreated"
        "400":
          $ref: "#/components/responses/AdminError"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/admin/keys/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: 调用方 API Key 的数据库 ID。
        schema:
          type: integer
          format: int64
          minimum: 1
    put:
      tags: [APIKeys]
      summary: 更新调用方 API Key 的元数据与权限
      security:
        - AdminSessionBearer: []
        - AdminKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/APIKeyMutation"
      responses:
        "200":
          description: 更新成功
          content:
            application/json:
              schema:
                type: object
                required: [success]
                properties:
                  success: { type: boolean, const: true }
        "400":
          $ref: "#/components/responses/AdminError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/AdminError"
    delete:
      tags: [APIKeys]
      summary: 删除调用方 API Key
      security:
        - AdminSessionBearer: []
        - AdminKey: []
      responses:
        "204":
          description: 删除请求已执行，无响应正文
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/AdminError"
  /api/admin/keys/{id}/disable:
    parameters:
      - $ref: "#/components/parameters/APIKeyID"
    post:
      tags: [APIKeys]
      summary: 禁用调用方 API Key
      security:
        - AdminSessionBearer: []
        - AdminKey: []
      responses:
        "200":
          description: 新状态
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIKeyStatusResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/AdminError"
  /api/admin/keys/{id}/enable:
    parameters:
      - $ref: "#/components/parameters/APIKeyID"
    post:
      tags: [APIKeys]
      summary: 启用调用方 API Key
      security:
        - AdminSessionBearer: []
        - AdminKey: []
      responses:
        "200":
          description: 新状态
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIKeyStatusResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/AdminError"
  /api/admin/keys/{id}/rotate:
    parameters:
      - $ref: "#/components/parameters/APIKeyID"
    post:
      tags: [APIKeys]
      summary: 轮换调用方 API Key
      description: 旧 Key 立即失效；新明文只在本次响应中返回一次。
      security:
        - AdminSessionBearer: []
        - AdminKey: []
      responses:
        "200":
          description: 新 Key 明文（仅显示一次）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIKeyRotated"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/AdminError"
  /api/auth/login:
    post:
      tags: [Authentication]
      summary: 使用用户名和密码创建管理会话
      description: 登录请求按客户端 IP 限流；成功返回的会话 Token 通过后续请求的 Authorization Bearer 头传递，不使用 Cookie。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/AdminError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/AdminError"
  /api/auth/logout:
    post:
      tags: [Authentication]
      summary: 注销当前管理会话
      description: 请求附带有效的管理会话 Bearer Token 时会撤销该 Token；接口保持幂等并始终返回 204。
      security:
        - AdminSessionBearer: []
      responses:
        "204":
          description: 注销请求完成，无响应正文
  /api/auth/me:
    get:
      tags: [Authentication]
      summary: 查询当前管理会话用户
      security:
        - AdminSessionBearer: []
      responses:
        "200":
          description: 当前会话用户
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionUser"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/auth/credentials:
    get:
      tags: [Authentication]
      summary: 查询控制台登录配置概要
      security:
        - AdminSessionBearer: []
        - AdminKey: []
      responses:
        "200":
          description: 当前用户名及配置存储位置概要
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredentialsView"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/AdminError"
    put:
      tags: [Authentication]
      summary: 修改控制台登录用户名或密码
      description: 必须使用 Web 登录会话，且提供当前密码；修改后会更新会话版本。
      security:
        - AdminSessionBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CredentialsMutation"
      responses:
        "200":
          description: 更新后的用户信息
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionUser"
        "400":
          $ref: "#/components/responses/AdminError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/AdminError"
        "503":
          $ref: "#/components/responses/AdminError"


  /api/models:
    get:
      tags: [Admin]
      summary: 列出 Gateway 管理的模型元数据
      security:
        - AdminSessionBearer: []
        - AdminKey: []
      responses:
        "200":
          description: 模型元数据列表
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/AdminError"
  /api/admin/audit/metrics:
    get:
      tags: [Admin]
      summary: 读取审计队列内存指标
      description: 此接口只读取进程内审计队列快照，不查询数据库，不返回请求正文或凭据。
      security:
        - AdminSessionBearer: []
        - AdminKey: []
      responses:
        "200":
          description: 审计队列统计快照
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditMetricsEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/AdminError"
  /api/requests:
    get:
      tags: [Admin]
      summary: 查询请求记录列表
      description: 列表合并数据库历史记录与当前 Gateway 进程的实时请求；provider 按规范化 Provider ID 完整匹配。
      security:
        - AdminSessionBearer: []
        - AdminKey: []
      parameters:
        - name: limit
          in: query
          required: false
          description: 返回条数，默认 50。
          schema: { type: integer, minimum: 1, default: 50 }
        - name: request_id
          in: query
          required: false
          schema: { type: string }
        - name: model
          in: query
          required: false
          schema: { type: string }
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [running, success, error, cancelled] }
        - name: key
          in: query
          required: false
          description: 调用方 API Key 名称筛选。
          schema: { type: string }
        - name: provider
          in: query
          required: false
          description: Provider ID 精确匹配，忽略大小写及首尾空格。
          schema: { type: string }
      responses:
        "200":
          description: 请求日志列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/AdminError"
    delete:
      tags: [Admin]
      summary: 清空请求日志
      description: 危险操作，会清除请求历史记录与实时看板记录。
      security:
        - AdminSessionBearer: []
        - AdminKey: []
      responses:
        "200":
          description: 已删除记录数量
          content:
            application/json:
              schema:
                type: object
                required: [success, deleted]
                properties:
                  success: { type: boolean, const: true }
                  deleted: { type: integer, minimum: 0 }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/AdminError"
  /api/requests/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Gateway 请求 ID。
        schema: { type: string, minLength: 1 }
    get:
      tags: [Admin]
      summary: 获取单条请求详情
      description: 详情可能包含已保存的 prompt、请求/响应正文、请求头和 SSE 事件；这些字段受 logging.store_payload 等配置影响，应仅对可信管理员开放。
      security:
        - AdminSessionBearer: []
        - AdminKey: []
      responses:
        "200":
          description: 请求详情、时序和诊断信息
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestDetail"
        "400":
          $ref: "#/components/responses/AdminError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/AdminError"
        "500":
          $ref: "#/components/responses/AdminError"
  /api/admin/runtime:
    get:
      tags: [Admin]
      summary: 获取活动后端的运行时概览
      description: 本地后端返回已加载模型和目录；远程 Provider 不会伪装成本地运行时模型。
      security:
        - AdminSessionBearer: []
        - AdminKey: []
      responses:
        "200":
          description: 运行时快照；字段依活动后端变化
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeSnapshot"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "502":
          $ref: "#/components/responses/AdminError"
  /api/admin/runtime/preview:
    get:
      tags: [Admin]
      summary: 预览指定本地运行时的模型清单
      parameters:
        - name: backend
          in: query
          required: true
          schema: { type: string, enum: [llamacpp, ollama] }
      security:
        - AdminSessionBearer: []
        - AdminKey: []
      responses:
        "200":
          description: 本地运行时预览
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeSnapshot"
        "400":
          $ref: "#/components/responses/AdminError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "502":
          $ref: "#/components/responses/AdminError"
  /api/admin/runtime/select:
    post:
      tags: [Admin]
      summary: 加载或选择本地模型
      description: 只支持本地 llama.cpp/Ollama 后端；model_id 或 model_key 至少提供一个。
      security:
        - AdminSessionBearer: []
        - AdminKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RuntimeModelRequest"
      responses:
        "200":
          description: 选择后的模型及运行时快照
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeActionResult"
        "400":
          $ref: "#/components/responses/AdminError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "502":
          $ref: "#/components/responses/AdminError"
  /api/admin/runtime/unload:
    post:
      tags: [Admin]
      summary: 卸载当前本地模型
      security:
        - AdminSessionBearer: []
        - AdminKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RuntimeModelRequest"
      responses:
        "200":
          description: 卸载操作结果
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          $ref: "#/components/responses/AdminError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "502":
          $ref: "#/components/responses/AdminError"
  /api/benchmark:
    post:
      tags: [Admin]
      summary: 启动异步模型 Benchmark
      description: Benchmark 任务保存在进程内，Gateway 重启后历史任务不保证可恢复。结果通过返回的 poll URL 查询。整体请求时限由服务端 llama.request_timeout_seconds 控制；设为 0 不添加整体 Deadline，但主动停止和父请求取消仍然生效。
      security:
        - AdminSessionBearer: []
        - AdminKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BenchmarkCreateRequest"
      responses:
        "200":
          description: 已创建 Benchmark 任务
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BenchmarkStartResult"
        "400":
          $ref: "#/components/responses/AdminError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/AdminError"
  /api/benchmark/{job_id}:
    parameters:
      - name: job_id
        in: path
        required: true
        schema: { type: string, minLength: 1 }
    get:
      tags: [Admin]
      summary: 查询 Benchmark 任务状态和输出
      security:
        - AdminSessionBearer: []
        - AdminKey: []
      responses:
        "200":
          description: Benchmark 任务与流式输出快照
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BenchmarkStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/AdminError"
    delete:
      tags: [Admin]
      summary: 请求停止 Benchmark 任务
      security:
        - AdminSessionBearer: []
        - AdminKey: []
      responses:
        "200":
          description: 停止信号状态
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/AdminError"

components:
  securitySchemes:
    GatewayBearer:
      type: http
      scheme: bearer
      description: 调用方 Gateway API Key，不是上游厂商 Key，也不是管理员凭据。
    GatewayAPIKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: 与 Authorization: Bearer 等价，适用于推理入口。
    AdminSessionBearer:
      type: http
      scheme: bearer
      description: 由 POST /api/auth/login 返回的管理会话 Token；与调用方推理 Key、上游 Provider Key 分离。
    AdminKey:
      type: apiKey
      in: header
      name: X-Admin-Key
      description: 部署配置的管理员凭据，供管理 API 自动化调用；不是调用方推理 Key。
  parameters:
    AgentPrefix:
      name: agentPrefix
      in: path
      required: true
      description: 必须匹配配置中启用的单段小写 Agent path_prefix。
      schema:
        type: string
        pattern: "^[a-z0-9][a-z0-9._-]{0,63}$"
  requestBodies:
    InferenceJSON:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/InferencePayload"
  responses:
    InferenceResponse:
      description: 上游成功响应；是否流式取决于请求中的 stream 字段及上游支持情况。
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
        text/event-stream:
          schema:
            type: string
            description: 原始 SSE 事件流；流式开始后可能以协议对应的安全 error 事件收口。
    InferenceError:
      description: 网关或上游错误；流式响应一旦提交，错误会改用对应协议的 SSE 错误事件。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Unauthorized:
      description: API Key 无效、缺失或已过期；管理 API 也可能要求登录。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    RateLimited:
      description: 调用方 Key 或 Provider RPM 超限；Provider RPM 会返回 Retry-After。
      headers:
        Retry-After:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    AdminError:
      description: 管理操作失败；具体错误码随端点和冲突类型变化。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  pathItems:
    ProviderEnable:
      parameters:
        - $ref: "#/components/parameters/ProviderID"
      post:
        tags: [Admin]
      security:
        - AdminSessionBearer: []
        - AdminKey: []
        summary: 启用 Web Provider
        x-authentication-requirements:
          - valid admin web session
          - configured administrator credential
        responses:
          "200":
            description: 返回最新 Provider 列表
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/ProviderList"
          "401":
            $ref: "#/components/responses/Unauthorized"
          "409":
            $ref: "#/components/responses/AdminError"
          "503":
            $ref: "#/components/responses/AdminError"
    ProviderDisable:
      parameters:
        - $ref: "#/components/parameters/ProviderID"
      post:
        tags: [Admin]
      security:
        - AdminSessionBearer: []
        - AdminKey: []
        summary: 停用 Web Provider
        description: 当前活动 Provider 不可停用。
        x-authentication-requirements:
          - valid admin web session
          - configured administrator credential
        responses:
          "200":
            description: 返回最新 Provider 列表
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/ProviderList"
          "401":
            $ref: "#/components/responses/Unauthorized"
          "409":
            $ref: "#/components/responses/AdminError"
          "503":
            $ref: "#/components/responses/AdminError"
    ProviderClearKey:
      parameters:
        - $ref: "#/components/parameters/ProviderID"
      post:
        tags: [Admin]
      security:
        - AdminSessionBearer: []
        - AdminKey: []
        summary: 显式清除 Web Provider 的 API Key
        description: 当前活动 Provider 不可清除 Key；调用前应先切换活动 Provider。
        x-authentication-requirements:
          - valid admin web session
          - configured administrator credential
        responses:
          "200":
            description: 返回最新 Provider 列表
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/ProviderList"
          "401":
            $ref: "#/components/responses/Unauthorized"
          "409":
            $ref: "#/components/responses/AdminError"
          "503":
            $ref: "#/components/responses/AdminError"
    ProviderTest:
      parameters:
        - $ref: "#/components/parameters/ProviderID"
      post:
        tags: [Admin]
      security:
        - AdminSessionBearer: []
        - AdminKey: []
        summary: 测试 Provider 连接
        description: 使用模型列表端点进行轻量测试，不发起计费推理；结果应为脱敏诊断信息。
        x-authentication-requirements:
          - valid admin web session
          - configured administrator credential
        responses:
          "200":
            description: 连接测试结果；业务失败也可能在结果字段中报告
            content:
              application/json:
                schema:
                  type: object
                  additionalProperties: true
          "401":
            $ref: "#/components/responses/Unauthorized"
          "404":
            $ref: "#/components/responses/AdminError"
          "409":
            $ref: "#/components/responses/AdminError"
          "503":
            $ref: "#/components/responses/AdminError"
  schemas:
    InferencePayload:
      type: object
      description: 依所调用协议提供对应 JSON 请求；Gateway 会按选定 Provider/Agent 的路由规则处理模型身份。
      additionalProperties: true
    ModelList:
      type: object
      properties:
        object:
          type: string
          const: list
        data:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              object:
                type: string
              owned_by:
                type: string
              display_name:
                type: string
            additionalProperties: true
      required: [object, data]
      additionalProperties: true
    ErrorEnvelope:
      type: object
      description: 统一错误通常包含稳定错误码与安全 message；协议专用错误形状可能不同。
      additionalProperties: true
    RequestStats:
      type: object
      required: [range, from, to, requests, latency, tokens]
      properties:
        range:
          type: string
          enum: [24h, 7d, 30d]
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        provider_id:
          type: string
        requests:
          type: object
          required: [total_requests, completed_requests, success_requests, error_requests, cancelled_requests, running_requests, success_rate_percent]
          properties:
            total_requests: { type: integer, minimum: 0 }
            completed_requests: { type: integer, minimum: 0 }
            success_requests: { type: integer, minimum: 0 }
            error_requests: { type: integer, minimum: 0 }
            cancelled_requests: { type: integer, minimum: 0 }
            running_requests: { type: integer, minimum: 0 }
            success_rate_percent: { type: number, minimum: 0, maximum: 100 }
        latency:
          type: object
          required: [sample_count, buckets]
          properties:
            sample_count: { type: integer, minimum: 0 }
            average_ms:
              type: number
              minimum: 0
            buckets:
              type: array
              items:
                type: object
                required: [label, count]
                properties:
                  label: { type: string }
                  count: { type: integer, minimum: 0 }
        tokens:
          type: object
          required: [upstream_usage, llama_timings, unknown_source, note]
          properties:
            upstream_usage: { $ref: "#/components/schemas/TokenSourceStats" }
            llama_timings: { $ref: "#/components/schemas/TokenSourceStats" }
            unknown_source: { $ref: "#/components/schemas/TokenSourceStats" }
            note: { type: string }
    TokenSourceStats:
      type: object
      required: [requests, input_tokens, output_tokens, total_tokens]
      properties:
        requests: { type: integer, minimum: 0 }
        input_tokens: { type: integer, minimum: 0 }
        output_tokens: { type: integer, minimum: 0 }
        total_tokens: { type: integer, minimum: 0 }
    ProviderMutation:
      type: object
      required: [id, enabled, base_url, default_model]
      properties:
        id:
          type: string
          pattern: "^[a-z0-9][a-z0-9._-]{0,63}$"
        enabled:
          type: boolean
        base_url:
          type: string
          format: uri
          description: 必须满足 Gateway 的 HTTPS、SSRF、私网和重定向安全校验。
        api_key:
          type: string
          writeOnly: true
          description: 编辑时留空表示保留原 Key；不会在响应中回显。
        api_key_header:
          type: string
          enum: [authorization, api-key, x-api-key]
        default_model:
          type: string
          minLength: 1
          maxLength: 255
        model_mappings:
          type: object
          additionalProperties:
            type: string
        allow_insecure_http:
          type: boolean
          default: false
        allow_private_network:
          type: boolean
          default: false
        max_response_bytes:
          type: integer
          minimum: 0
          maximum: 536870912
        max_concurrent_requests:
          type: integer
          minimum: 0
          maximum: 64
          default: 64
        requests_per_minute:
          type: integer
          minimum: 0
          maximum: 100000
          default: 0
        request_timeout_seconds:
          type: integer
          minimum: 0
          maximum: 86400
          default: 0
      additionalProperties: false
    ProviderView:
      type: object
      required: [id, enabled, base_url, api_key_configured, api_key_masked, default_model, source, editable]
      properties:
        id: { type: string }
        enabled: { type: boolean }
        base_url: { type: string }
        api_key_configured: { type: boolean }
        api_key_masked: { type: string }
        api_key_header: { type: string }
        default_model: { type: string }
        model_mappings:
          type: object
          additionalProperties: { type: string }
        allow_insecure_http: { type: boolean }
        allow_private_network: { type: boolean }
        max_response_bytes: { type: integer }
        max_concurrent_requests: { type: integer }
        requests_per_minute: { type: integer }
        request_timeout_seconds: { type: integer }
        source:
          type: string
          enum: [deployment, web]
        editable: { type: boolean }
        source_conflict: { type: boolean }
        secret_unavailable: { type: boolean }
      additionalProperties: true
    ProviderList:
      type: object
      required: [data, encryption_available]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ProviderView"
        encryption_available:
          type: boolean
    APIKeyMetadata:
      type: object
      required: [id, name, prefix, status, rpm, allowed_models]
      description: 不包含明文 Key 与哈希的调用方 Key 元数据。
      properties:
        id: { type: integer, format: int64, minimum: 1 }
        name: { type: string }
        prefix: { type: string }
        status:
          type: string
          enum: [active, disabled, expired]
        rpm:
          type: integer
          minimum: 0
          description: 服务端将非正值规范化为默认值 60。
        allowed_models:
          type: array
          items: { type: string }
        expires_at:
          type: [string, "null"]
          format: date-time
        created_at:
          type: [string, "null"]
          format: date-time
        updated_at:
          type: [string, "null"]
          format: date-time
        last_used_at:
          type: [string, "null"]
          format: date-time
      additionalProperties: false
    APIKeyList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/APIKeyMetadata"
    APIKeyMutation:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
        rpm:
          type: integer
          minimum: 0
          description: 非正值使用默认值 60。
        allowed_models:
          type: array
          items: { type: string }
        expires_at:
          type: [string, "null"]
          format: date-time
          description: null 表示不设置过期时间。
      additionalProperties: false
    APIKeyCreated:
      type: object
      required: [key, api_key]
      properties:
        key:
          type: string
          readOnly: true
          description: 仅本次创建响应返回的明文 Key，请立即安全保存。
        api_key:
          $ref: "#/components/schemas/APIKeyMetadata"
    APIKeyRotated:
      type: object
      required: [key]
      properties:
        key:
          type: string
          readOnly: true
          description: 新明文 Key，仅在轮换响应中出现一次。
    APIKeyStatusResult:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [active, disabled]
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string, format: password, writeOnly: true }
      additionalProperties: false
    LoginResponse:
      type: object
      required: [token, user]
      properties:
        token:
          type: string
          readOnly: true
          description: 管理会话 Token，后续使用 Authorization: Bearer 传递。
        user:
          type: object
          required: [username]
          properties:
            username: { type: string }
    SessionUser:
      type: object
      required: [user]
      properties:
        user:
          type: object
          required: [username]
          properties:
            username: { type: string }
    CredentialsView:
      type: object
      required: [username, stored_in_db, can_change_via]
      properties:
        username: { type: string }
        stored_in_db: { type: boolean }
        can_change_via:
          type: string
          const: web
    CredentialsMutation:
      type: object
      required: [current_password]
      properties:
        current_password:
          type: string
          format: password
          writeOnly: true
        new_username:
          type: string
          description: 留空表示不修改用户名。
        new_password:
          type: string
          format: password
          writeOnly: true
          description: 留空表示不修改密码。
      additionalProperties: false

    RequestList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            type: object
            description: 请求列表记录；字段随当前数据版本扩展。
            additionalProperties: true
    RequestDetail:
      type: object
      required: [log, summary, timing, diagnosis]
      description: 详情可能包含正文、请求头、响应头和流式事件；只有启用相应审计配置或事件已捕获时才会出现。
      properties:
        log:
          type: object
          additionalProperties: true
        summary:
          type: object
          additionalProperties: true
        timing:
          type: object
          additionalProperties: true
        diagnosis:
          type: array
          items: { type: string }
        analysis:
          type: object
          additionalProperties: true
        payload:
          type: object
          additionalProperties: { type: string }
        stream_events:
          type: array
          items:
            type: object
            additionalProperties: true
      additionalProperties: true
    AuditMetricsEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: object
          description: 审计队列深度、容量、完成/失败、排队耗时和丢弃计数等内存快照。
          additionalProperties: true
    RuntimeSnapshot:
      type: object
      description: 字段依据本地 llama.cpp、Ollama 或远程 Provider 运行时而变化。
      additionalProperties: true
    RuntimeModelRequest:
      type: object
      properties:
        model_id: { type: string }
        model_key: { type: string }
      additionalProperties: false
    RuntimeActionResult:
      type: object
      required: [success]
      properties:
        success: { type: boolean, const: true }
        active_model: { type: string }
        runtime:
          $ref: "#/components/schemas/RuntimeSnapshot"
      additionalProperties: true
    BenchmarkCreateRequest:
      type: object
      properties:
        model_key: { type: string }
        model_id: { type: string }
        model: { type: string, description: model_id 的兼容别名。 }
        prompt: { type: string }
        max_tokens:
          type: integer
          minimum: 1
          maximum: 8192
          default: 4000
        use_active: { type: boolean }
        temperature: { type: number }
        top_p: { type: number }
        top_k: { type: integer }
        min_p: { type: number }
        frequency_penalty: { type: number }
        presence_penalty: { type: number }
        repeat_penalty: { type: number }
        seed: { type: integer, format: int64 }
        enable_thinking: { type: boolean }
        stop:
          type: array
          items: { type: string }
      additionalProperties: false
    BenchmarkStartResult:
      type: object
      required: [job_id, request_id, status, poll, request_log, message]
      properties:
        job_id: { type: string }
        request_id: { type: string }
        status: { type: string, const: running }
        poll: { type: string }
        request_log: { type: string }
        message: { type: string }
    BenchmarkStatus:
      type: object
      required: [job, stream_events, request_id, request_log]
      properties:
        job:
          type: object
          additionalProperties: true
        stream_events:
          type: array
          items:
            type: object
            additionalProperties: true
        request_id: { type: string }
        request_log: { type: string }
        analysis:
          type: object
          additionalProperties: true
      additionalProperties: true

  parameters:
    APIKeyID:
      name: id
      in: path
      required: true
      description: 调用方 API Key 数据库 ID。
      schema:
        type: integer
        format: int64
        minimum: 1
    ProviderID:
      name: id
      in: path
