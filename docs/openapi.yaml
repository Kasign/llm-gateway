            properties:
              model_key: { type: string }
              name: { type: string }
              kind: { type: string, enum: [hf, ollama] }
              status: { type: string, enum: [downloading, download_failed, download_cancelled, ready] }
              done: { type: integer, format: int64 }
              total: { type: integer, format: int64 }
              error: { type: string }
            additionalProperties: true
      additionalProperties: true
    DownloadDismissRequest:
      type: object
