        health: { type: string }
        url_from_env_only: { type: boolean }
        upstream_probes:
          type: object
          additionalProperties: true
        inference_active_model_id: { type: string }
        inference_active_by_backend:
          type: object
          additionalProperties: { type: string }
      additionalProperties: true
    BackendSwitchResult:
      type: object
      required: [success, active, available_backends]
      properties:
        success: { type: boolean, const: true }
        active:
          type: object
          additionalProperties: true
        configured_urls:
          type: object
          additionalProperties: { type: string }
        available_backends:
          type: array
          items:
            type: object
            additionalProperties: true
        health: { type: string }
      additionalProperties: true
