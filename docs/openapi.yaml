      properties:
        version: { type: integer, const: 1 }
        reachability:
          type: object
          additionalProperties: true
        inference_summary:
          type: object
          additionalProperties: true
        dependencies:
          type: object
          additionalProperties: true
        host:
          type: object
          additionalProperties: true
      additionalProperties: true
    InferenceParamsSchema:
