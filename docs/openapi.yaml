openapi: 3.1.0
info:
  title: LLM Gateway API
  version: 0.1.0
  summary: LLM Gateway 稳定入口的分阶段 API 契约
  description: |
    本规范覆盖公共推理入口、配置 Agent 前缀入口、调用方 API Key、网页登录、请求审计与统计、
    Web Provider、模型生命周期、下载任务、后端切换、推理参数与初始化快照等主要接口。
    仍标记为 partial：动态推理参数、运行时/上游透传对象按可扩展字段描述。CI 会核对
    Go 路由注册表与 paths 路径集合，但不会自动逐个比较 Handler 的 JSON 字段 Schema。
    管理操作需要管理员网页登录态或部署管理员凭据；
    推理请求使用调用方 Gateway API Key。
  x-contract-status: partial
servers:
  - url: /
    description: 当前部署的 Gateway 主机
tags:
  - name: Inference
    description: 对 OpenAI-compatible 与 Anthropic Messages 入口的转发
  - name: Admin
    description: 管理员会话保护的统计、运行时、后端与 Provider 管理
  - name: ModelManagement
    description: Gateway 模型、上游后端、Hugging Face 和 Ollama 模型发现及生命周期操作
  - name: Downloads
    description: Hugging Face 下载和 Ollama Pull 任务进度与清理
  - name: APIKeys
    description: 生成与治理调用方 Gateway API Key；明文只在创建或轮换时返回一次。
  - name: Authentication
    description: 控制台登录、会话注销和凭据更新。
paths:
  /health:
    get:
      operationId: getHealth
      tags: [Inference]
      summary: 查看 Gateway 与依赖的健康状态
      description: 远程 Provider 状态主要表示已配置；健康检查结果不等于真实供应商推理 E2E 已通过。
      responses:
        "200":
          description: 健康状态
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /v1/models:
    get:
      operationId: getV1Models
      tags: [Inference]
      summary: 列出当前活动 Provider 对外发布的模型
      security:
        - GatewayBearer: []
        - GatewayAPIKey: []
      responses:
        "200":
          description: 模型目录
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelList"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/chat/completions:
    post:
      operationId: postV1ChatCompletions
      tags: [Inference]
      summary: Chat Completions 推理
      security:
        - GatewayBearer: []
        - GatewayAPIKey: []
      requestBody:
        $ref: "#/components/requestBodies/InferenceJSON"
      responses:
        "200":
          $ref: "#/components/responses/InferenceResponse"
        "400":
          $ref: "#/components/responses/InferenceError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          $ref: "#/components/responses/InferenceError"
        "503":
          $ref: "#/components/responses/InferenceError"
        "504":
          $ref: "#/components/responses/InferenceError"
  /v1/completions:
    post:
      operationId: postV1Completions
      tags: [Inference]
      summary: Completions 推理
      security:
        - GatewayBearer: []
        - GatewayAPIKey: []
      requestBody:
        $ref: "#/components/requestBodies/InferenceJSON"
      responses:
        "200":
          $ref: "#/components/responses/InferenceResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          $ref: "#/components/responses/InferenceError"
        "503":
          $ref: "#/components/responses/InferenceError"
        "504":
          $ref: "#/components/responses/InferenceError"
  /v1/responses:
    post:
      operationId: postV1Responses
      tags: [Inference]
      summary: Responses API 推理
      description: 流式错误必须使用 Responses 事件形状；响应已提交后不能再更改 HTTP 状态。
      security:
        - GatewayBearer: []
        - GatewayAPIKey: []
      requestBody:
        $ref: "#/components/requestBodies/InferenceJSON"
      responses:
        "200":
          $ref: "#/components/responses/InferenceResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          $ref: "#/components/responses/InferenceError"
        "503":
          $ref: "#/components/responses/InferenceError"
        "504":
          $ref: "#/components/responses/InferenceError"
  /v1/messages:
    post:
      operationId: postV1Messages
      tags: [Inference]
      summary: Anthropic Messages 兼容转发
      description: 请求体限制为 32,000,000 字节；错误信封与 OpenAI 协议不同，具体兼容性取决于配置的上游。
      security:
        - GatewayBearer: []
        - GatewayAPIKey: []
      requestBody:
        $ref: "#/components/requestBodies/InferenceJSON"
      responses:
        "200":
          $ref: "#/components/responses/InferenceResponse"
        "400":
          $ref: "#/components/responses/InferenceError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          $ref: "#/components/responses/InferenceError"
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          $ref: "#/components/responses/InferenceError"
        "503":
          $ref: "#/components/responses/InferenceError"
        "504":
          $ref: "#/components/responses/InferenceError"
  /v1/messages/count_tokens:
    post:
      operationId: postV1MessagesCountTokens
      tags: [Inference]
      summary: 转发 Anthropic Messages Token 计数请求
      description: Gateway 不自行计算 Anthropic Token；该路径是否可用取决于上游实现。
      security:
        - GatewayBearer: []
        - GatewayAPIKey: []
      requestBody:
        $ref: "#/components/requestBodies/InferenceJSON"
      responses:
        "200":
          $ref: "#/components/responses/InferenceResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "502":
          $ref: "#/components/responses/InferenceError"
        "503":
          $ref: "#/components/responses/InferenceError"
        "504":
          $ref: "#/components/responses/InferenceError"
  /{agentPrefix}/v1/models:
    parameters:
      - $ref: "#/components/parameters/AgentPrefix"
    get:
      operationId: getAgentPrefixV1Models
      tags: [Inference]
      summary: 列出指定 Agent 固定 Provider 的模型
      description: agentPrefix 必须与启动配置中已启用的 Agent path_prefix 匹配；该路径不允许任意客户端选择 Provider。
      security:
        - GatewayBearer: []
        - GatewayAPIKey: []
      responses:
        "200":
          description: 模型目录
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelList"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /{agentPrefix}/v1/chat/completions:
    parameters:
      - $ref: "#/components/parameters/AgentPrefix"
    post:
      operationId: postAgentPrefixV1ChatCompletions
      tags: [Inference]
      summary: 通过指定 Agent 执行 Chat Completions
      security:
        - GatewayBearer: []
        - GatewayAPIKey: []
      requestBody:
        $ref: "#/components/requestBodies/InferenceJSON"
      responses:
        "200":
          $ref: "#/components/responses/InferenceResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          $ref: "#/components/responses/InferenceError"
        "503":
          $ref: "#/components/responses/InferenceError"
        "504":
          $ref: "#/components/responses/InferenceError"
  /api/requests/stats:
    get:
      operationId: getApiRequestsStats
      tags: [Admin]
      security:
        - AdminSessionBearer: []
        - AdminKey: []
      summary: 查询请求、延迟和 Token 来源聚合统计
      description: |
        仅管理员可访问。range 仅接受 24h、7d、30d；窗口按 started_at 使用 [from,to) 计算。
        Provider ID 是规范化后完整匹配，统计不继承请求列表的模型、状态或 Key 名称筛选。
        Tokens 区分上游 usage、llama.cpp timings 与来源未知；该来源分类不等同于费用核算。
      x-authentication-requirements:
        - valid admin web session
        - configured administrator credential
      parameters:
        - name: range
          in: query
          required: false
          description: 固定统计窗口，默认 24h
          schema:
            type: string
            enum: [24h, 7d, 30d]
            default: 24h
        - name: provider
          in: query
          required: false
          description: Provider ID 完整匹配；忽略大小写与首尾空格
          schema:
            type: string
            maxLength: 64
      responses:
        "200":
          description: 聚合统计结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestStats"
        "400":
          $ref: "#/components/responses/AdminError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/AdminError"
  /api/admin/providers:
    get:
      operationId: getApiAdminProviders
      tags: [Admin]
      security:
        - AdminSessionBearer: []
        - AdminKey: []
      summary: 列出部署托管与 Web 管理的 Provider
      description: 返回 Key 是否已配置和掩码，不返回明文或密文；部署配置 Provider 为只读。
      x-authentication-requirements:
        - valid admin web session
        - configured administrator credential
      responses:
        "200":
          description: Provider 目录与密钥加密能力
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderList"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: postApiAdminProviders
      tags: [Admin]
      security:
        - AdminSessionBearer: []
        - AdminKey: []
      summary: 创建 Web 管理的 Provider
      description: API Key 仅接受写入；响应不会回显密钥。ID 与部署配置冲突时拒绝覆盖。
      x-authentication-requirements:
        - valid admin web session
        - configured administrator credential
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProviderMutation"
      responses:
        "201":
          description: Provider 创建成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderList"
        "400":
          $ref: "#/components/responses/AdminError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/AdminError"
        "503":
          $ref: "#/components/responses/AdminError"
  /api/admin/providers/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Web 管理的 Provider ID；部署托管项不可修改或删除
        schema:
          type: string
          minLength: 1
          maxLength: 64
    put:
      operationId: putApiAdminProvidersId
      tags: [Admin]
      security:
        - AdminSessionBearer: []
        - AdminKey: []
      summary: 更新 Web 管理的 Provider
      description: 编辑时 api_key 留空表示保留既有 Key；清除 Key 必须使用单独的 clear-key 操作。
      x-authentication-requirements:
        - valid admin web session
        - configured administrator credential
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProviderMutation"
      responses:
        "200":
          description: 操作完成并返回当前 Provider 列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderList"
        "400":
          $ref: "#/components/responses/AdminError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/AdminError"
        "503":
          $ref: "#/components/responses/AdminError"
    delete:
      operationId: deleteApiAdminProvidersId
      tags: [Admin]
      security:
        - AdminSessionBearer: []
        - AdminKey: []
      summary: 删除 Web 管理的 Provider
      description: 当前活动 Provider 不可删除；必须先切换活动上游。
      x-authentication-requirements:
        - valid admin web session
        - configured administrator credential
      responses:
        "204":
          description: Provider 已删除；响应正文为空。
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/AdminError"
        "409":
          $ref: "#/components/responses/AdminError"
        "503":
          $ref: "#/components/responses/AdminError"
  /api/admin/providers/{id}/enable:
    $ref: "#/components/pathItems/ProviderEnable"
  /api/admin/providers/{id}/disable:
    $ref: "#/components/pathItems/ProviderDisable"
  /api/admin/providers/{id}/clear-key:
    $ref: "#/components/pathItems/ProviderClearKey"
  /api/admin/providers/{id}/test:
    $ref: "#/components/pathItems/ProviderTest"

  /api/admin/keys:
    get:
      operationId: getApiAdminKeys
      tags: [APIKeys]
      summary: 列出调用方 API Key 元数据
      description: 不返回明文 Key 或存储哈希。
      security:
        - AdminSessionBearer: []
        - AdminKey: []
      responses:
        "200":
          description: Key 元数据列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIKeyList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/AdminError"
    post:
      operationId: postApiAdminKeys
      tags: [APIKeys]
      summary: 创建调用方 API Key
      description: 明文 Key 只在创建响应中返回一次；服务端持久化哈希，不提供再次查询明文的接口。
      security:
        - AdminSessionBearer: []
        - AdminKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/APIKeyMutation"
      responses:
        "200":
          description: 创建成功，包含只显示一次的明文 Key 与元数据
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIKeyCreated"
        "400":
          $ref: "#/components/responses/AdminError"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/admin/keys/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: 调用方 API Key 的数据库 ID。
        schema:
          type: integer
          format: int64
          minimum: 1
    put:
      operationId: putApiAdminKeysId
      tags: [APIKeys]
      summary: 更新调用方 API Key 的元数据与权限
      security:
        - AdminSessionBearer: []
        - AdminKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/APIKeyMutation"
      responses:
        "200":
          description: 更新成功
          content:
            application/json:
              schema:
                type: object
                required: [success]
                properties:
                  success: { type: boolean, const: true }
        "400":
          $ref: "#/components/responses/AdminError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/AdminError"
    delete:
      operationId: deleteApiAdminKeysId
      tags: [APIKeys]
      summary: 删除调用方 API Key
      security:
        - AdminSessionBearer: []
        - AdminKey: []
      responses:
        "204":
          description: 删除请求已执行，无响应正文
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/AdminError"
  /api/admin/keys/{id}/disable:
    parameters:
      - $ref: "#/components/parameters/APIKeyID"
    post:
      operationId: postApiAdminKeysIdDisable
      tags: [APIKeys]
      summary: 禁用调用方 API Key
      security:
        - AdminSessionBearer: []
        - AdminKey: []
      responses:
        "200":
          description: 新状态
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIKeyStatusResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/AdminError"
  /api/admin/keys/{id}/enable:
    parameters:
      - $ref: "#/components/parameters/APIKeyID"
    post:
      operationId: postApiAdminKeysIdEnable
      tags: [APIKeys]
      summary: 启用调用方 API Key
      security:
        - AdminSessionBearer: []
        - AdminKey: []
      responses:
        "200":
          description: 新状态
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIKeyStatusResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/AdminError"
  /api/admin/keys/{id}/rotate:
    parameters:
      - $ref: "#/components/parameters/APIKeyID"
    post:
      operationId: postApiAdminKeysIdRotate
      tags: [APIKeys]
      summary: 轮换调用方 API Key
      description: 旧 Key 立即失效；新明文只在本次响应中返回一次。
      security:
        - AdminSessionBearer: []
        - AdminKey: []
      responses:
        "200":
          description: 新 Key 明文（仅显示一次）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIKeyRotated"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/AdminError"
  /api/auth/login:
    post:
      operationId: postApiAuthLogin
      tags: [Authentication]
      summary: 使用用户名和密码创建管理会话
      description: 登录请求按客户端 IP 限流；成功返回的会话 Token 通过后续请求的 Authorization Bearer 头传递，不使用 Cookie。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/AdminError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/AdminError"
  /api/auth/logout:
    post:
      operationId: postApiAuthLogout
      tags: [Authentication]
      summary: 注销当前管理会话
      description: 请求附带有效的管理会话 Bearer Token 时会撤销该 Token；接口保持幂等并始终返回 204。
      security:
        - AdminSessionBearer: []
      responses:
        "204":
          description: 注销请求完成，无响应正文
  /api/auth/me:
    get:
      operationId: getApiAuthMe
      tags: [Authentication]
      summary: 查询当前管理会话用户
      security:
        - AdminSessionBearer: []
      responses:
        "200":
          description: 当前会话用户
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionUser"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/auth/credentials:
    get:
      operationId: getApiAuthCredentials
      tags: [Authentication]
      summary: 查询控制台登录配置概要
      security:
        - AdminSessionBearer: []
        - AdminKey: []
      responses:
        "200":
          description: 当前用户名及配置存储位置概要
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredentialsView"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/AdminError"
    put:
      operationId: putApiAuthCredentials
      tags: [Authentication]
      summary: 修改控制台登录用户名或密码
      description: 必须使用 Web 登录会话，且提供当前密码；修改后会更新会话版本。
      security:
        - AdminSessionBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CredentialsMutation"
      responses:
        "200":
          description: 更新后的用户信息
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionUser"
        "400":
          $ref: "#/components/responses/AdminError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/AdminError"
        "503":
          $ref: "#/components/responses/AdminError"


  /api/models:
    get:
      operationId: getApiModels
      tags: [Admin]
      summary: 列出 Gateway 管理的模型元数据
      security:
        - AdminSessionBearer: []
        - AdminKey: []
      responses:
        "200":
          description: 模型元数据列表
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/GatewayModel"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/AdminError"
  /api/admin/audit/metrics:
    get:
      operationId: getApiAdminAuditMetrics
      tags: [Admin]
      summary: 读取审计队列内存指标
      description: 此接口只读取进程内审计队列快照，不查询数据库，不返回请求正文或凭据。
      security:
        - AdminSessionBearer: []
        - AdminKey: []
      responses:
        "200":
          description: 审计队列统计快照
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditMetricsEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/AdminError"
  /api/admin/retention/status:
    get:
      operationId: getApiAdminRetentionStatus
      tags: [Admin]
      summary: 查看请求日志保留策略的运行状态
      description: 返回静态保留配置、当前进程计数、最近一次清理结果和稳定失败代码；不查询数据库、不暴露原始数据库错误，进程重启后计数归零。
      security:
        - AdminSessionBearer: []
        - AdminKey: []
      responses:
        "200":
          description: 保留策略运行状态
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/RequestRetentionStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "405":
          $ref: "#/components/responses/AdminError"
  /api/requests:
    get:
      operationId: getApiRequests
      tags: [Admin]
      summary: 查询请求记录列表
      description: 列表合并数据库历史记录与当前 Gateway 进程的实时请求；provider 按规范化 Provider ID 完整匹配。
      security:
        - AdminSessionBearer: []
        - AdminKey: []
      parameters:
        - name: limit
          in: query
          required: false
          description: 返回条数，默认 50。
          schema: { type: integer, minimum: 1, default: 50 }
        - name: request_id
          in: query
          required: false
          schema: { type: string }
        - name: model
          in: query
          required: false
          schema: { type: string }
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [running, success, error, cancelled] }
        - name: key
          in: query
          required: false
          description: 调用方 API Key 名称筛选。
          schema: { type: string }
        - name: provider
          in: query
          required: false
          description: Provider ID 精确匹配，忽略大小写及首尾空格。
          schema: { type: string }
      responses:
        "200":
          description: 请求日志列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/AdminError"
    delete:
      operationId: deleteApiRequests
      tags: [Admin]
      summary: 清空请求日志
      description: 危险操作，会清除请求历史记录与实时看板记录。
      security:
        - AdminSessionBearer: []
        - AdminKey: []
      responses:
        "200":
          description: 已删除记录数量
          content:
            application/json:
              schema:
                type: object
                required: [success, deleted]
                properties:
                  success: { type: boolean, const: true }
                  deleted: { type: integer, minimum: 0 }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/AdminError"
  /api/requests/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Gateway 请求 ID。
        schema: { type: string, minLength: 1 }
    get:
      operationId: getApiRequestsId
      tags: [Admin]
      summary: 获取单条请求详情
      description: 详情可能包含已保存的 prompt、请求/响应正文、请求头和 SSE 事件；这些字段受 logging.store_payload 等配置影响，应仅对可信管理员开放。
      security:
        - AdminSessionBearer: []
        - AdminKey: []
      responses:
        "200":
          description: 请求详情、时序和诊断信息
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestDetail"
        "400":
          $ref: "#/components/responses/AdminError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/AdminError"
        "500":
          $ref: "#/components/responses/AdminError"

  /api/requests/{id}/cancel:
    parameters:
      - name: id
        in: path
        required: true
        description: 正在运行或需要收口的 Gateway 请求 ID。
        schema: { type: string, minLength: 1 }
    post:
      operationId: postApiRequestsIdCancel
      tags: [Admin]
      summary: 取消正在运行的推理请求
      description: 取消在途 Run；若进程内任务已不存在，会尝试将遗留的 running 审计记录收口。请求已开始收尾或已经结束时返回 409。
      security:
        - AdminSessionBearer: []
        - AdminKey: []
      x-authentication-requirements:
        - valid admin web session
        - configured administrator credential
      responses:
        "200":
          description: 已发出取消信号，或成功收口遗留记录
          content:
            application/json:
              schema:
                type: object
                required: [request_id, cancelled]
                properties:
                  request_id: { type: string }
                  cancelled: { type: boolean, const: true }
                additionalProperties: true
        "400":
          $ref: "#/components/responses/AdminError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "405":
          $ref: "#/components/responses/AdminError"
        "409":
          description: 请求已经不在运行，或已开始最终收尾。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api/admin/runtime:
    get:
      operationId: getApiAdminRuntime
      tags: [Admin]
      summary: 获取活动后端的运行时概览
      description: 本地后端返回已加载模型和目录；远程 Provider 不会伪装成本地运行时模型。
      security:
        - AdminSessionBearer: []
        - AdminKey: []
      responses:
        "200":
          description: 运行时快照；字段依活动后端变化
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeSnapshot"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "502":
          $ref: "#/components/responses/AdminError"
  /api/admin/runtime/refresh:
    post:
      operationId: postApiAdminRuntimeRefresh
      tags: [Admin]
      summary: 刷新 llama.cpp 模型目录
      description: Router 模式下重新扫描注册目录并清除运行时缓存；单模型模式只查询当前模型，不虚报动态加载能力。
      security:
        - AdminSessionBearer: []
        - AdminKey: []
      responses:
        "200":
          description: 模型目录刷新完成
          content:
            application/json:
              schema:
                type: object
                required: [success, backend]
                properties:
                  success: { type: boolean, const: true }
                  backend: { type: string, const: llamacpp }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "405":
          $ref: "#/components/responses/AdminError"
        "502":
          $ref: "#/components/responses/AdminError"
  /api/admin/runtime/preview:
    get:
      operationId: getApiAdminRuntimePreview
      tags: [Admin]
      summary: 预览指定本地运行时的模型清单
      parameters:
        - name: backend
          in: query
          required: true
          schema: { type: string, enum: [llamacpp, ollama] }
      security:
        - AdminSessionBearer: []
        - AdminKey: []
      responses:
        "200":
          description: 本地运行时预览
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeSnapshot"
        "400":
          $ref: "#/components/responses/AdminError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "502":
          $ref: "#/components/responses/AdminError"
  /api/admin/runtime/select:
    post:
      operationId: postApiAdminRuntimeSelect
      tags: [Admin]
      summary: 加载或选择本地模型
      description: 只支持本地 llama.cpp/Ollama 后端；model_id 或 model_key 至少提供一个。
      security:
        - AdminSessionBearer: []
        - AdminKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RuntimeModelRequest"
      responses:
        "200":
          description: 选择后的模型及运行时快照
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeActionResult"
        "400":
          $ref: "#/components/responses/AdminError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "502":
          $ref: "#/components/responses/AdminError"
  /api/admin/runtime/unload:
    post:
      operationId: postApiAdminRuntimeUnload
      tags: [Admin]
      summary: 卸载当前本地模型
      security:
        - AdminSessionBearer: []
        - AdminKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RuntimeModelRequest"
      responses:
        "200":
          description: 卸载操作结果
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          $ref: "#/components/responses/AdminError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "502":
          $ref: "#/components/responses/AdminError"
  /api/benchmark:
    post:
      operationId: postApiBenchmark
      tags: [Admin]
      summary: 启动异步模型 Benchmark
      description: Benchmark 任务保存在进程内，Gateway 重启后历史任务不保证可恢复。结果通过返回的 poll URL 查询。整体请求时限由服务端 llama.request_timeout_seconds 控制；设为 0 不添加整体 Deadline，但主动停止和父请求取消仍然生效。
      security:
        - AdminSessionBearer: []
        - AdminKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BenchmarkCreateRequest"
      responses:
        "200":
          description: 已创建 Benchmark 任务
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BenchmarkStartResult"
        "400":
          $ref: "#/components/responses/AdminError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/AdminError"
  /api/benchmark/{job_id}:
    parameters:
      - name: job_id
        in: path
        required: true
        schema: { type: string, minLength: 1 }
    get:
      operationId: getApiBenchmarkJobId
      tags: [Admin]
      summary: 查询 Benchmark 任务状态和输出
      security:
        - AdminSessionBearer: []
        - AdminKey: []
      responses:
        "200":
          description: Benchmark 任务与流式输出快照
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BenchmarkStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/AdminError"
    delete:
      operationId: deleteApiBenchmarkJobId
      tags: [Admin]
      summary: 请求停止 Benchmark 任务
      security:
        - AdminSessionBearer: []
        - AdminKey: []
      responses:
        "200":
          description: 停止信号状态
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/AdminError"

  /{agentPrefix}/v1/completions:
    parameters:
      - $ref: "#/components/parameters/AgentPrefix"
    post:
      operationId: postAgentPrefixV1Completions
      tags: [Inference]
      summary: 通过指定 Agent 执行 Completions
      description: Agent 固定 Provider，不允许请求体任意选择后端；具体兼容性取决于该 Provider。
      security:
        - GatewayBearer: []
        - GatewayAPIKey: []
      requestBody:
        $ref: "#/components/requestBodies/InferenceJSON"
      responses:
        "200":
          $ref: "#/components/responses/InferenceResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          $ref: "#/components/responses/InferenceError"
        "503":
          $ref: "#/components/responses/InferenceError"
        "504":
          $ref: "#/components/responses/InferenceError"
  /{agentPrefix}/v1/responses:
    parameters:
      - $ref: "#/components/parameters/AgentPrefix"
    post:
      operationId: postAgentPrefixV1Responses
      tags: [Inference]
      summary: 通过指定 Agent 执行 Responses API
      description: 流式错误使用 Responses 事件形状；响应已提交后不能更改 HTTP 状态。
      security:
        - GatewayBearer: []
        - GatewayAPIKey: []
      requestBody:
        $ref: "#/components/requestBodies/InferenceJSON"
      responses:
        "200":
          $ref: "#/components/responses/InferenceResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          $ref: "#/components/responses/InferenceError"
        "503":
          $ref: "#/components/responses/InferenceError"
        "504":
          $ref: "#/components/responses/InferenceError"
  /{agentPrefix}/v1/messages:
    parameters:
      - $ref: "#/components/parameters/AgentPrefix"
    post:
      operationId: postAgentPrefixV1Messages
      tags: [Inference]
      summary: 通过指定 Agent 执行 Anthropic Messages
      description: 请求体限制为 32,000,000 字节；错误信封与 OpenAI 协议不同。
      security:
        - GatewayBearer: []
        - GatewayAPIKey: []
      requestBody:
        $ref: "#/components/requestBodies/InferenceJSON"
      responses:
        "200":
          $ref: "#/components/responses/InferenceResponse"
        "400":
          $ref: "#/components/responses/InferenceError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          $ref: "#/components/responses/InferenceError"
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          $ref: "#/components/responses/InferenceError"
        "503":
          $ref: "#/components/responses/InferenceError"
        "504":
          $ref: "#/components/responses/InferenceError"
  /{agentPrefix}/v1/messages/count_tokens:
    parameters:
      - $ref: "#/components/parameters/AgentPrefix"
    post:
      operationId: postAgentPrefixV1MessagesCountTokens
      tags: [Inference]
      summary: 通过指定 Agent 转发 Anthropic token 计数请求
      description: Gateway 不自行计算 token；该路由是否可用取决于 Agent 固定的上游 Provider。
      security:
        - GatewayBearer: []
        - GatewayAPIKey: []
      requestBody:
        $ref: "#/components/requestBodies/InferenceJSON"
      responses:
        "200":
          $ref: "#/components/responses/InferenceResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "502":
          $ref: "#/components/responses/InferenceError"
        "503":
          $ref: "#/components/responses/InferenceError"
        "504":
          $ref: "#/components/responses/InferenceError"

  /api/hf/files:
    get:
      operationId: getApiHfFiles
      tags: [ModelManagement]
      summary: 列出 Hugging Face 仓库中的 GGUF 文件
      description: 只返回文件路径、大小和 SHA-256，不会开始下载；仓库名必填，revision 默认 main。
      security:
        - AdminSessionBearer: []
        - AdminKey: []
      x-authentication-requirements: [valid admin web session, configured administrator credential]
      parameters:
        - name: repo
          in: query
          required: true
          schema: { type: string, minLength: 1 }
        - name: revision
          in: query
          required: false
          schema: { type: string, default: main }
      responses:
        "200":
          description: 仓库文件列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HuggingFaceFileList"
        "400":
          $ref: "#/components/responses/AdminError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "502":
          $ref: "#/components/responses/AdminError"
  /api/hf/search:
    get:
      operationId: getApiHfSearch
      tags: [ModelManagement]
      summary: 搜索 Hugging Face 模型目录
      description: q 优先；未提供时兼容 search。此接口只发现模型，不会触发下载。
      security:
        - AdminSessionBearer: []
        - AdminKey: []
      x-authentication-requirements: [valid admin web session, configured administrator credential]
      parameters:
        - name: q
          in: query
          required: false
          schema: { type: string }
        - name: search
          in: query
          required: false
          description: q 为空时使用的兼容参数。
          schema: { type: string }
        - name: sort
          in: query
          required: false
          schema: { type: string, enum: [hot, newest], default: hot }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 30 }
        - name: hf_gguf
          in: query
          required: false
          schema: { type: boolean, default: true }
      responses:
        "200":
          description: 搜索结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogSearchResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "502":
          $ref: "#/components/responses/AdminError"
  /api/models/install:
    post:
      operationId: postApiModelsInstall
      tags: [ModelManagement]
      summary: 将 Hugging Face GGUF 加入 Gateway 下载队列
      description: 请求成功后立即返回 downloading；实际下载在后台执行，通过 GET /api/downloads 查询进度。
      security:
        - AdminSessionBearer: []
        - AdminKey: []
      x-authentication-requirements: [valid admin web session, configured administrator credential]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModelInstallRequest"
      responses:
        "200":
          description: 已创建下载记录并启动后台任务
          content:
            application/json:
              schema:
                type: object
                required: [success, status, model_key]
                properties:
                  success: { type: boolean, const: true }
                  status: { type: string, const: downloading }
                  model_key: { type: string }
        "400":
          $ref: "#/components/responses/AdminError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: model_key 或同一仓库文件已存在。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          $ref: "#/components/responses/AdminError"
  /api/models/refresh:
    post:
      operationId: postApiModelsRefresh
      tags: [ModelManagement]
      summary: 刷新 llama.cpp 上游模型注册表
      description: 兼容管理接口；对于日常加载/卸载，优先使用 /api/admin/model-ops。响应透传上游 JSON。
      security:
        - AdminSessionBearer: []
        - AdminKey: []
      x-authentication-requirements: [valid admin web session, configured administrator credential]
      responses:
        "200":
          description: 上游返回的刷新结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlexibleObject"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "502":
          $ref: "#/components/responses/AdminError"
  /api/models/{model_key}:
    parameters:
      - name: model_key
        in: path
        required: true
        description: Gateway 本地模型记录的唯一 key。
        schema: { type: string, minLength: 1 }
    delete:
      operationId: deleteApiModelsModelKey
      tags: [ModelManagement]
      summary: 删除 Gateway 本地模型记录和文件
      description: 会尝试卸载上游模型，并删除 Gateway 模型文件及数据库记录；这是破坏性操作。
      security:
        - AdminSessionBearer: []
        - AdminKey: []
      x-authentication-requirements: [valid admin web session, configured administrator credential]
      responses:
        "204":
          description: 删除成功；响应正文为空。
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/AdminError"
        "500":
          $ref: "#/components/responses/AdminError"
  /api/models/{model_key}/{action}:
    parameters:
      - name: model_key
        in: path
        required: true
        schema: { type: string, minLength: 1 }
      - name: action
        in: path
        required: true
        description: load/unload/refresh/cancel/retry 均为兼容动作。
        schema:
          type: string
          enum: [load, unload, refresh, cancel, retry]
    post:
      operationId: postApiModelsModelKeyAction
      tags: [ModelManagement]
      summary: 执行 Gateway 模型兼容操作
      description: load/unload 只影响上游内存；cancel/retry 用于下载任务。新管理调用优先使用 /api/admin/model-ops。
      security:
        - AdminSessionBearer: []
        - AdminKey: []
      x-authentication-requirements: [valid admin web session, configured administrator credential]
      responses:
        "200":
          description: 操作执行成功。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                additionalProperties: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/AdminError"
        "502":
          $ref: "#/components/responses/AdminError"
  /api/downloads:
    get:
      operationId: getApiDownloads
      tags: [Downloads]
      summary: 查询模型下载和 Ollama Pull 任务
      description: 合并 HF 下载与 Ollama Pull 状态；进度来源包含 Gateway 数据库和 Redis。完成任务按服务端保留策略显示。
      security:
        - AdminSessionBearer: []
        - AdminKey: []
      x-authentication-requirements: [valid admin web session, configured administrator credential]
      responses:
        "200":
          description: 当前应展示的下载任务列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadsEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/AdminError"
  /api/downloads/dismiss:
    post:
      operationId: postApiDownloadsDismiss
      tags: [Downloads]
      summary: 清理单条失败/取消下载，或批量清理所有失败/取消任务
      description: 不能清理仍处于 downloading 的任务。all_failed=true 忽略 model_key，并清理所有可清理的失败/取消项。
      security:
        - AdminSessionBearer: []
        - AdminKey: []
      x-authentication-requirements: [valid admin web session, configured administrator credential]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DownloadDismissRequest"
      responses:
        "200":
          description: 已清理的记录数
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadDismissResult"
        "400":
          $ref: "#/components/responses/AdminError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/AdminError"
  /api/admin/bootstrap:
    get:
      operationId: getApiAdminBootstrap
      tags: [Admin]
      summary: 获取管理台完整初始化快照
      description: 返回活动后端、依赖可达性、模型计数与主机资源；主机指标是最近缓存快照，不应视为实时性能采样。
      security:
        - AdminSessionBearer: []
        - AdminKey: []
      x-authentication-requirements: [valid admin web session, configured administrator credential]
      responses:
        "200":
          description: 完整管理台初始化快照
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BootstrapResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/admin/bootstrap/lite:
    get:
      operationId: getApiAdminBootstrapLite
      tags: [Admin]
      summary: 获取轻量管理台初始化快照
      description: 只返回依赖可达性、推理概览与主机指标；不返回完整活动后端/URL 清单。
      security:
        - AdminSessionBearer: []
        - AdminKey: []
      x-authentication-requirements: [valid admin web session, configured administrator credential]
      responses:
        "200":
          description: 轻量初始化快照
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BootstrapLiteResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/admin/backend:
    get:
      operationId: getApiAdminBackend
      tags: [Admin]
      summary: 查看活动上游和可用后端
      description: refresh=1 或 probe=1 会刷新可达性探测缓存。远程 Provider 显示为已配置，不代表已经完成真实推理连通性验证。
      security:
        - AdminSessionBearer: []
        - AdminKey: []
      x-authentication-requirements: [valid admin web session, configured administrator credential]
      parameters:
        - name: refresh
          in: query
          required: false
          schema: { type: string, enum: ["1"] }
        - name: probe
          in: query
          required: false
          schema: { type: string, enum: ["1"] }
      responses:
        "200":
          description: 活动上游、默认值、健康状态和探测结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackendOverview"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      operationId: putApiAdminBackend
      tags: [Admin]
      summary: 切换活动推理后端和模型
      description: backend 接受 llamacpp、ollama 或已配置的远程 Provider ID。model_id 为空时兼容使用 model_name；切换可能触发上游模型加载。
      security:
        - AdminSessionBearer: []
        - AdminKey: []
      x-authentication-requirements: [valid admin web session, configured administrator credential]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BackendSwitchRequest"
      responses:
        "200":
          description: 活动后端切换完成
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackendSwitchResult"
        "400":
          $ref: "#/components/responses/AdminError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "502":
          $ref: "#/components/responses/AdminError"
  /api/admin/backend/unload-all:
    post:
      operationId: postApiAdminBackendUnloadAll
      tags: [Admin]
      summary: 卸载当前本地后端的所有内存模型
      description: 只支持当前活动后端为 llama.cpp 或 Ollama 的情况；不删除磁盘模型，远程 Provider 返回 unsupported_operation。
      security:
        - AdminSessionBearer: []
        - AdminKey: []
      x-authentication-requirements: [valid admin web session, configured administrator credential]
      responses:
        "200":
          description: 卸载完成
          content:
            application/json:
              schema:
                type: object
                required: [success]
                properties:
                  success: { type: boolean, const: true }
        "400":
          $ref: "#/components/responses/AdminError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "502":
          $ref: "#/components/responses/AdminError"
  /api/admin/backend/upstream-models:
    get:
      operationId: getApiAdminBackendUpstreamModels
      tags: [Admin]
      summary: 获取活动后端可见的模型列表
      description: 返回活动本地后端的上游模型列表；远程 Provider 返回当前配置模型的兼容列表，不会调用供应商模型目录 API。
      security:
        - AdminSessionBearer: []
        - AdminKey: []
      x-authentication-requirements: [valid admin web session, configured administrator credential]
      responses:
        "200":
          description: 上游模型列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "502":
          $ref: "#/components/responses/AdminError"
  /api/admin/catalog/search:
    get:
      operationId: getApiAdminCatalogSearch
      tags: [Admin]
      summary: 搜索模型目录（Hugging Face 或 Ollama Library）
      security:
        - AdminSessionBearer: []
        - AdminKey: []
      x-authentication-requirements: [valid admin web session, configured administrator credential]
      parameters:
        - name: q
          in: query
          required: false
          schema: { type: string }
        - name: source
          in: query
          required: false
          description: 搜索来源；具体支持项由目录服务决定。
          schema: { type: string, enum: [hf, ollama] }
        - name: sort
          in: query
          required: false
          schema: { type: string, enum: [hot, newest], default: hot }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 30 }
        - name: hf_gguf
          in: query
          required: false
          schema: { type: boolean, default: true }
      responses:
        "200":
          description: 目录搜索结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogSearchResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "502":
          $ref: "#/components/responses/AdminError"
  /api/admin/catalog/ollama/tags:
    get:
      operationId: getApiAdminCatalogOllamaTags
      tags: [Admin]
      summary: 查询 Ollama Library 中某模型的 tags
      security:
        - AdminSessionBearer: []
        - AdminKey: []
      x-authentication-requirements: [valid admin web session, configured administrator credential]
      parameters:
        - name: model
          in: query
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        "200":
          description: 模型及 tags 列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OllamaTagList"
        "400":
          $ref: "#/components/responses/AdminError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "502":
          $ref: "#/components/responses/AdminError"
  /api/admin/inference-params/schema:
    get:
      operationId: getApiAdminInferenceParamsSchema
      tags: [Admin]
      summary: 获取推理参数配置表单 Schema
      description: 字段随 Gateway 支持的后端和推理参数实现演进；客户端应按此接口动态渲染，不要硬编码全部字段。
      security:
        - AdminSessionBearer: []
        - AdminKey: []
      x-authentication-requirements: [valid admin web session, configured administrator credential]
      responses:
        "200":
          description: 参数字段、分组标题和分组说明
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InferenceParamsSchema"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/admin/inference-params:
    get:
      operationId: getApiAdminInferenceParams
      tags: [Admin]
      summary: 获取指定本地推理后端的推理参数与生效策略
      description: backend 支持 llamacpp 或 ollama，缺省为 llamacpp。
      security:
        - AdminSessionBearer: []
        - AdminKey: []
      x-authentication-requirements: [valid admin web session, configured administrator credential]
      parameters:
        - name: backend
          in: query
          required: false
          schema: { type: string, enum: [llamacpp, ollama], default: llamacpp }
      responses:
        "200":
          description: 已保存、有效和默认推理参数及策略
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InferenceParamsEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/AdminError"
    put:
      operationId: putApiAdminInferenceParams
      tags: [Admin]
      summary: 保存指定后端的推理参数和可选参数策略
      security:
        - AdminSessionBearer: []
        - AdminKey: []
      x-authentication-requirements: [valid admin web session, configured administrator credential]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InferenceParamsMutation"
      responses:
        "200":
          description: 保存成功
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean, const: true }
        "400":
          $ref: "#/components/responses/AdminError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/AdminError"
  /api/admin/inference-params/reset:
    post:
      operationId: postApiAdminInferenceParamsReset
      tags: [Admin]
      summary: 将指定后端推理参数恢复为部署默认值
      security:
        - AdminSessionBearer: []
        - AdminKey: []
      x-authentication-requirements: [valid admin web session, configured administrator credential]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                backend:
                  type: string
                  enum: [llamacpp, ollama]
                  default: llamacpp
              additionalProperties: true
      responses:
        "200":
          description: 重置后的推理参数
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InferenceParamsResetResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/AdminError"
  /api/admin/local-inventory:
    get:
      operationId: getApiAdminLocalInventory
      tags: [ModelManagement]
      summary: 查询 Gateway 本地 GGUF 与 Ollama 模型目录
      security:
        - AdminSessionBearer: []
        - AdminKey: []
      x-authentication-requirements: [valid admin web session, configured administrator credential]
      responses:
        "200":
          description: 本地模型与 Ollama tag 清单
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocalInventoryEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/AdminError"
  /api/admin/ollama:
    get:
      operationId: getApiAdminOllama
      tags: [ModelManagement]
      summary: 查询配置的 Ollama 后端目录与加载状态
      description: 需要部署时配置 OLLAMA_BASE_URL；模型本地列表与加载状态来自 Ollama API。
      security:
        - AdminSessionBearer: []
        - AdminKey: []
      x-authentication-requirements: [valid admin web session, configured administrator credential]
      responses:
        "200":
          description: Ollama 模型目录与加载状态
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OllamaOverview"
        "400":
          $ref: "#/components/responses/AdminError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "502":
          $ref: "#/components/responses/AdminError"
  /api/admin/ollama/pull:
    post:
      operationId: postApiAdminOllamaPull
      tags: [ModelManagement]
      summary: 启动 Ollama 模型 Pull 任务
      description: 返回 job_id 后通过 GET /api/downloads 查询进度；本接口不会等待整个模型下载完毕。
      security:
        - AdminSessionBearer: []
        - AdminKey: []
      x-authentication-requirements: [valid admin web session, configured administrator credential]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OllamaPullRequest"
      responses:
        "200":
          description: 任务已启动
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OllamaPullStartResult"
        "400":
          $ref: "#/components/responses/AdminError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "502":
          $ref: "#/components/responses/AdminError"
  /api/admin/ollama/pull/cancel:
    post:
      operationId: postApiAdminOllamaPullCancel
      tags: [ModelManagement]
      summary: 取消 Ollama Pull 任务
      security:
        - AdminSessionBearer: []
        - AdminKey: []
      x-authentication-requirements: [valid admin web session, configured administrator credential]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OllamaPullCancelRequest"
      responses:
        "200":
          description: 已发出取消信号
          content:
            application/json:
              schema:
                type: object
                required: [success]
                properties:
                  success: { type: boolean, const: true }
        "400":
          $ref: "#/components/responses/AdminError"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/admin/ollama/load:
    post:
      operationId: postApiAdminOllamaLoad
      tags: [ModelManagement]
      summary: 加载 Ollama 模型（兼容接口）
      description: 只改变运行时内存状态，不删除模型文件。新调用优先使用 /api/admin/model-ops。
      security:
        - AdminSessionBearer: []
        - AdminKey: []
      x-authentication-requirements: [valid admin web session, configured administrator credential]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OllamaModelRequest"
      responses:
        "200":
          description: 加载请求已成功完成
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OllamaModelActionResult"
        "400":
          $ref: "#/components/responses/AdminError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "502":
          $ref: "#/components/responses/AdminError"
  /api/admin/ollama/unload:
    post:
      operationId: postApiAdminOllamaUnload
      tags: [ModelManagement]
      summary: 卸载 Ollama 模型（兼容接口）
      description: 只释放运行时内存；要从磁盘移除模型请使用 delete。
      security:
        - AdminSessionBearer: []
        - AdminKey: []
      x-authentication-requirements: [valid admin web session, configured administrator credential]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OllamaModelRequest"
      responses:
        "200":
          description: 卸载请求已成功完成
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OllamaModelActionResult"
        "400":
          $ref: "#/components/responses/AdminError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "502":
          $ref: "#/components/responses/AdminError"
  /api/admin/ollama/delete:
    post:
      operationId: postApiAdminOllamaDelete
      tags: [ModelManagement]
      summary: 删除 Ollama 模型（兼容接口）
      description: 从 Ollama 存储中移除模型；与仅释放内存的 unload 不同。
      security:
        - AdminSessionBearer: []
        - AdminKey: []
      x-authentication-requirements: [valid admin web session, configured administrator credential]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OllamaModelRequest"
      responses:
        "200":
          description: 操作步骤和完成状态
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelOpsResult"
        "400":
          $ref: "#/components/responses/AdminError"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/admin/model-ops:
    post:
      operationId: postApiAdminModelOps
      tags: [ModelManagement]
      summary: 统一的模型列表、加载和卸载管理入口
      description: action 支持 list/load/unload；load/unload 时需要 model_id 或 model_key。操作日志与业务成功标记放在 JSON 返回值中；上游操作失败可能返回 HTTP 200 且 success=false。
      security:
        - AdminSessionBearer: []
        - AdminKey: []
      x-authentication-requirements: [valid admin web session, configured administrator credential]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModelOpsRequest"
      responses:
        "200":
          description: 操作结果，包括操作步骤日志
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelOpsResult"
        "400":
          $ref: "#/components/responses/AdminError"
        "401":
          $ref: "#/components/responses/Unauthorized"

components:
  securitySchemes:
    GatewayBearer:
      type: http
      scheme: bearer
      description: 调用方 Gateway API Key，不是上游厂商 Key，也不是管理员凭据。
    GatewayAPIKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: 与 Authorization: Bearer 等价，适用于推理入口。
    AdminSessionBearer:
      type: http
      scheme: bearer
      description: 由 POST /api/auth/login 返回的管理会话 Token；与调用方推理 Key、上游 Provider Key 分离。
    AdminKey:
      type: apiKey
      in: header
      name: X-Admin-Key
      description: 部署配置的管理员凭据，供管理 API 自动化调用；不是调用方推理 Key。
  parameters:
    AgentPrefix:
      name: agentPrefix
      in: path
      required: true
      description: 必须匹配配置中启用的单段小写 Agent path_prefix。
      schema:
        type: string
        pattern: "^[a-z0-9][a-z0-9._-]{0,63}$"
  requestBodies:
    InferenceJSON:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/InferencePayload"
  responses:
    InferenceResponse:
      description: 上游成功响应；是否流式取决于请求中的 stream 字段及上游支持情况。
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
        text/event-stream:
          schema:
            type: string
            description: 原始 SSE 事件流；流式开始后可能以协议对应的安全 error 事件收口。
    InferenceError:
      description: 网关或上游错误；流式响应一旦提交，错误会改用对应协议的 SSE 错误事件。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Unauthorized:
      description: API Key 无效、缺失或已过期；管理 API 也可能要求登录。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    RateLimited:
      description: 调用方 Key 或 Provider RPM 超限；Provider RPM 会返回 Retry-After。
      headers:
        Retry-After:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    AdminError:
      description: 管理操作失败；具体错误码随端点和冲突类型变化。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  pathItems:
    ProviderEnable:
      parameters:
        - $ref: "#/components/parameters/ProviderID"
      post:
        tags: [Admin]
      security:
        - AdminSessionBearer: []
        - AdminKey: []
        summary: 启用 Web Provider
        x-authentication-requirements:
          - valid admin web session
          - configured administrator credential
        responses:
          "200":
            description: 返回最新 Provider 列表
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/ProviderList"
          "401":
            $ref: "#/components/responses/Unauthorized"
          "409":
            $ref: "#/components/responses/AdminError"
          "503":
            $ref: "#/components/responses/AdminError"
    ProviderDisable:
      parameters:
        - $ref: "#/components/parameters/ProviderID"
      post:
        tags: [Admin]
      security:
        - AdminSessionBearer: []
        - AdminKey: []
        summary: 停用 Web Provider
        description: 当前活动 Provider 不可停用。
        x-authentication-requirements:
          - valid admin web session
          - configured administrator credential
        responses:
          "200":
            description: 返回最新 Provider 列表
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/ProviderList"
          "401":
            $ref: "#/components/responses/Unauthorized"
          "409":
            $ref: "#/components/responses/AdminError"
          "503":
            $ref: "#/components/responses/AdminError"
    ProviderClearKey:
      parameters:
        - $ref: "#/components/parameters/ProviderID"
      post:
        tags: [Admin]
      security:
        - AdminSessionBearer: []
        - AdminKey: []
        summary: 显式清除 Web Provider 的 API Key
        description: 当前活动 Provider 不可清除 Key；调用前应先切换活动 Provider。
        x-authentication-requirements:
          - valid admin web session
          - configured administrator credential
        responses:
          "200":
            description: 返回最新 Provider 列表
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/ProviderList"
          "401":
            $ref: "#/components/responses/Unauthorized"
          "409":
            $ref: "#/components/responses/AdminError"
          "503":
            $ref: "#/components/responses/AdminError"
    ProviderTest:
      parameters:
        - $ref: "#/components/parameters/ProviderID"
      post:
        tags: [Admin]
      security:
        - AdminSessionBearer: []
        - AdminKey: []
        summary: 测试 Provider 连接
        description: 使用模型列表端点进行轻量测试，不发起计费推理；结果应为脱敏诊断信息。
        x-authentication-requirements:
          - valid admin web session
          - configured administrator credential
        responses:
          "200":
            description: 连接测试结果；业务失败也可能在结果字段中报告
            content:
              application/json:
                schema:
                  type: object
                  additionalProperties: true
          "401":
            $ref: "#/components/responses/Unauthorized"
          "404":
            $ref: "#/components/responses/AdminError"
          "409":
            $ref: "#/components/responses/AdminError"
          "503":
            $ref: "#/components/responses/AdminError"
  schemas:
    InferencePayload:
      type: object
      description: 依所调用协议提供对应 JSON 请求；Gateway 会按选定 Provider/Agent 的路由规则处理模型身份。
      additionalProperties: true
    ModelList:
      type: object
      properties:
        object:
          type: string
          const: list
        data:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              object:
                type: string
              owned_by:
                type: string
              display_name:
                type: string
            additionalProperties: true
      required: [object, data]
      additionalProperties: true
    ErrorEnvelope:
      type: object
      description: 统一错误通常包含稳定错误码与安全 message；协议专用错误形状可能不同。
      additionalProperties: true
    RequestStats:
      type: object
      required: [range, from, to, requests, latency, tokens]
      properties:
        range:
          type: string
          enum: [24h, 7d, 30d]
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        provider_id:
          type: string
        requests:
          type: object
          required: [total_requests, completed_requests, success_requests, error_requests, cancelled_requests, running_requests, success_rate_percent]
          properties:
            total_requests: { type: integer, minimum: 0 }
            completed_requests: { type: integer, minimum: 0 }
            success_requests: { type: integer, minimum: 0 }
            error_requests: { type: integer, minimum: 0 }
            cancelled_requests: { type: integer, minimum: 0 }
            running_requests: { type: integer, minimum: 0 }
            success_rate_percent: { type: number, minimum: 0, maximum: 100 }
        latency:
          type: object
          required: [sample_count, buckets]
          properties:
            sample_count: { type: integer, minimum: 0 }
            average_ms:
              type: number
              minimum: 0
            buckets:
              type: array
              items:
                type: object
                required: [label, count]
                properties:
                  label: { type: string }
                  count: { type: integer, minimum: 0 }
        tokens:
          type: object
          required: [upstream_usage, llama_timings, unknown_source, note]
          properties:
            upstream_usage: { $ref: "#/components/schemas/TokenSourceStats" }
            llama_timings: { $ref: "#/components/schemas/TokenSourceStats" }
            unknown_source: { $ref: "#/components/schemas/TokenSourceStats" }
            note: { type: string }
    TokenSourceStats:
      type: object
      required: [requests, input_tokens, output_tokens, total_tokens]
      properties:
        requests: { type: integer, minimum: 0 }
        input_tokens: { type: integer, minimum: 0 }
        output_tokens: { type: integer, minimum: 0 }
        total_tokens: { type: integer, minimum: 0 }
    ProviderMutation:
      type: object
      required: [id, enabled, base_url, default_model]
      properties:
        id:
          type: string
          pattern: "^[a-z0-9][a-z0-9._-]{0,63}$"
        enabled:
          type: boolean
        base_url:
          type: string
          format: uri
          description: 必须满足 Gateway 的 HTTPS、SSRF、私网和重定向安全校验。
        api_key:
          type: string
          writeOnly: true
          description: 编辑时留空表示保留原 Key；不会在响应中回显。
        api_key_header:
          type: string
          enum: [authorization, api-key, x-api-key]
        default_model:
          type: string
          minLength: 1
          maxLength: 255
        model_mappings:
          type: object
          additionalProperties:
            type: string
        allow_insecure_http:
          type: boolean
          default: false
        allow_private_network:
          type: boolean
          default: false
        max_response_bytes:
          type: integer
          minimum: 0
          maximum: 536870912
        max_concurrent_requests:
          type: integer
          minimum: 0
          maximum: 64
          default: 64
        max_queue_size:
          type: integer
          minimum: 0
          maximum: 1024
          default: 0
          description: 单进程 FIFO 等待队列容量；0 关闭队列。
        queue_wait_timeout_seconds:
          type: integer
          minimum: 0
          maximum: 3600
          default: 30
          description: 队列等待时限（秒）；启用队列时 0 使用默认 30 秒。
        requests_per_minute:
          type: integer
          minimum: 0
          maximum: 100000
          default: 0
        token_budget_per_day:
          type: integer
          minimum: 0
          maximum: 1000000000000
          default: 0
          description: 每个 UTC 自然日的 Provider Token 预算；0 表示关闭。
        request_timeout_seconds:
          type: integer
          minimum: 0
          maximum: 86400
          default: 0
      additionalProperties: false
    ProviderView:
      type: object
      required: [id, enabled, base_url, api_key_configured, api_key_masked, default_model, source, editable]
      properties:
        id: { type: string }
        enabled: { type: boolean }
        base_url: { type: string }
        api_key_configured: { type: boolean }
        api_key_masked: { type: string }
        api_key_header: { type: string }
        default_model: { type: string }
