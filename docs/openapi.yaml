          additionalProperties: true
        configured_urls:
          type: object
          additionalProperties: { type: string }
        available_backends:
          type: array
          items:
            type: object
            required: [id, label, kind, base_url, source, editable]
            properties:
              id: { type: string }
              label: { type: string }
              kind: { type: string, enum: [local, remote] }
              base_url: { type: string }
              source: { type: string, enum: [deployment, web] }
              editable: { type: boolean }
              default_model: { type: string }
              requests_per_minute: { type: integer, minimum: 0 }
              api_key_configured: { type: boolean }
            additionalProperties: true
        url_warnings:
          type: array
