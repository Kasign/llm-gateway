        concurrent_requests_remaining: { type: integer, minimum: 0 }
        concurrent_requests_rejected: { type: integer, format: int64, minimum: 0 }
        concurrent_requests_usage_available: { type: boolean }
        max_queue_size: { type: integer, minimum: 0, maximum: 1024 }
        queue_wait_timeout_seconds: { type: integer, minimum: 0, maximum: 3600 }
        queued_requests: { type: integer, minimum: 0, description: 当前进程等待中的请求数量 }
        queue_limit: { type: integer, minimum: 0, maximum: 1024 }
        queue_timeouts: { type: integer, format: int64, minimum: 0 }
        requests_per_minute: { type: integer }
        token_budget_per_day: { type: integer, minimum: 0, maximum: 1000000000000 }
        token_budget_per_day_used: { type: integer, format: int64 }
        token_budget_per_day_remaining: { type: integer, format: int64 }
        token_budget_per_day_reset_seconds: { type: integer }
        token_budget_per_day_usage_available: { type: boolean }
        request_timeout_seconds: { type: integer }
        source:
          type: string
          enum: [deployment, web]
        editable: { type: boolean }
        source_conflict: { type: boolean }
        secret_unavailable: { type: boolean }
      additionalProperties: true
