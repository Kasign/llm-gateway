        configured_urls:
          type: object
          additionalProperties: { type: string }
        reachability:
          type: object
          additionalProperties: true
        inference_summary:
          type: object
          additionalProperties: true
        dependencies:
          type: object
          additionalProperties: true
        gateway_counts:
          type: object
          additionalProperties: true
        host:
          type: object
          additionalProperties: true
      additionalProperties: true
    BootstrapLiteResponse:
      type: object
