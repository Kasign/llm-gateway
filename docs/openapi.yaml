      description: 需要提供非空 model_key，或将 all_failed 设置为 true。
      additionalProperties: true
    DownloadDismissResult:
      type: object
      required: [success, cleared]
      properties:
        success: { type: boolean, const: true }
        cleared: { type: integer, minimum: 0 }
    BackendSwitchRequest:
      type: object
      required: [backend]
      properties:
